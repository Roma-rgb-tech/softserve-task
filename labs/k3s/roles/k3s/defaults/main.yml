---
k3s_version: v1.33.4+k3s1
k3s_release_url: https://github.com/k3s-io/k3s/releases/download
k3s_server_group: k3s_server
k3s_agent_group: k3s_agent
k3s_api_port: 6443
k3s_node_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
k3s_server_address: >-
  {{ hostvars[groups[k3s_server_group] | first].k3s_node_ip
     | default(hostvars[groups[k3s_server_group] | first].ansible_facts['default_ipv4']['address']) }}
k3s_config_dir: /etc/rancher/k3s
k3s_token_file: "{{ k3s_config_dir }}/cluster-token"
k3s_server_token_path: /var/lib/rancher/k3s/server/node-token
k3s_extra_server_config: {}
k3s_extra_agent_config: {}
k3s_kubeconfig_dest: "{{ playbook_dir }}/kubeconfig"
k3s_ready_retries: 60
k3s_ready_delay: 5
