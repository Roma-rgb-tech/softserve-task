---
- name: Write the server configuration
  become: true
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  vars:
    k3s_config: >-
      {{ {'node-ip': k3s_node_ip,
          'tls-san': [k3s_node_ip],
          'write-kubeconfig-mode': '0600'}
         | combine(k3s_extra_server_config) }}
  notify: Restart k3s

- name: Start the server
  become: true
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Apply a pending restart before anything talks to the API
  ansible.builtin.meta: flush_handlers

- name: Wait for the server to write its join token
  become: true
  ansible.builtin.wait_for:
    path: "{{ k3s_server_token_path }}"
    timeout: 300

- name: Wait for the API server to answer
  become: true
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - --raw
      - /readyz
  register: k3s_readyz
  until: k3s_readyz.rc == 0 and k3s_readyz.stdout == 'ok'
  retries: "{{ k3s_ready_retries }}"
  delay: "{{ k3s_ready_delay }}"
  changed_when: false

- name: Read the join token
  become: true
  ansible.builtin.slurp:
    src: "{{ k3s_server_token_path }}"
  register: k3s_server_token
  no_log: true

- name: Read the administrator kubeconfig
  become: true
  ansible.builtin.slurp:
    src: "{{ k3s_config_dir }}/k3s.yaml"
  register: k3s_kubeconfig
  no_log: true

- name: Save the kubeconfig on the controller, pointed at the server address
  ansible.builtin.copy:
    content: >-
      {{ k3s_kubeconfig.content | b64decode
         | replace('https://127.0.0.1:' ~ k3s_api_port, 'https://' ~ k3s_node_ip ~ ':' ~ k3s_api_port) }}
    dest: "{{ k3s_kubeconfig_dest }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
