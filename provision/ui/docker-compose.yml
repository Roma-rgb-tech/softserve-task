# UI VM: nginx serving the dashboard and proxying /api/* to the backend.
#
# BACKEND_HOST is rendered into nginx.conf at container start, so the same
# image works whether the backend is reachable by LAN address or by name.

services:
  ui:
    build:
      context: ../../ui-service
    image: ui-service
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
    ports:
      - "80:80"
