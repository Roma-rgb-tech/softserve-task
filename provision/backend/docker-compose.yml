# Backend VM: the only service the UI talks to.
#
# It holds UI session state in Redis and serves stored readings by querying
# the history service. It has no route to any public weather API — that
# belongs to the fetcher — and exposes no way to modify or delete history.

services:
  backend:
    build:
      context: ../../backend-service
    image: backend-service
    restart: unless-stopped
    environment:
      HISTORY_BASE: ${HISTORY_BASE}
      REDIS_URL: ${REDIS_URL}
      WATCHED_CITIES: ${WATCHED_CITIES}
    ports:
      - "8000:8000"
