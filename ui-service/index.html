<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
      body { padding: 1.5rem; background: #f5f7fb; }
      .card-weather { min-height: 160px; }
      .loading { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="d-flex align-items-center mb-4">
          <h1 class="me-auto">Weather Dashboard</h1>
          <div class="text-muted">Demo: Open‑Meteo • FastAPI • Postgres</div>
        </div>

      <div class="row g-3">
        <div class="col-md-5">
          <div class="card card-weather p-3 text-white" style="background: linear-gradient(135deg,#667eea,#764ba2);">
            <div class="mb-2 d-flex gap-2">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input id="city" class="form-control" placeholder="Enter city (e.g. Kyiv)" list="cities" />
                <datalist id="cities"></datalist>
                <button id="btn" class="btn btn-light">Search</button>
              </div>
              <button id="auto" class="btn btn-outline-light">Auto: off</button>
            </div>
            <div id="weather" class="fw-normal text-sm">No data yet — search a city.</div>
          </div>
        </div>

        <div class="col-md-7">
          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="mb-0">Recent requests</h5>
              <div>
                <button id="clear" class="btn btn-sm btn-danger me-2"><i class="fa-solid fa-trash"></i> Clear</button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm" id="history-table">
                <thead class="table-light"><tr><th></th><th>ID</th><th>Time</th><th>City</th><th>Params</th><th>Status</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="text-muted small">Auto-refreshes when you fetch or every 20s.</div>
          </div>
        </div>
      </div>
    </div>

      <script>
      const btn = document.getElementById('btn');
      const autoBtn = document.getElementById('auto');
      const cityEl = document.getElementById('city');
      const datalist = document.getElementById('cities');
      const clearBtn = document.getElementById('clear');
      const weatherEl = document.getElementById('weather');
      const tableBody = document.querySelector('#history-table tbody');
      let auto = false;
      let timer = null;

      async function fetchWeather() {
        const city = cityEl.value.trim();
        if (!city) {
          weatherEl.innerText = 'Enter a city name.';
          return;
        }
        weatherEl.classList.add('loading');
        try {
          const res = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
          const json = await res.json();
          const cw = json.payload?.current_weather || null;
          let html = '';
          const location = json.location_name || city;
          if (cw) {
            html = `
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <h2 class="display-5 fw-bold">${cw.temperature}°C</h2>
                  <div>${location}</div>
                </div>
                <div class="text-end small">
                  <div>Wind: ${cw.windspeed} m/s</div>
                  <div>Dir: ${cw.winddirection}°</div>
                </div>
              </div>`;
          } else {
            html = `<pre>${JSON.stringify(json, null, 2)}</pre>`;
          }
          weatherEl.innerHTML = html;
        } catch (e) {
          weatherEl.innerText = 'Error fetching weather: ' + e;
        } finally {
          weatherEl.classList.remove('loading');
        }
        await fetchHistory();
      }

      async function fetchHistory() {
        try {
          const res = await fetch('/api/history/recent?limit=15');
          const rows = await res.json();
          tableBody.innerHTML = '';
          for (const r of rows) {
            const tr = document.createElement('tr');
            const icon = getWeatherIcon(r.response_body?.current_weather);
            tr.innerHTML = `
              <td class="align-middle">${icon}</td>
              <td>${r.id}</td>
              <td>${new Date(r.event_time).toLocaleString()}</td>
              <td>${r.response_body?.location_name || r.query_params?.city || ''}</td>
              <td>${JSON.stringify(r.query_params)}</td>
              <td>${r.response_status} <button data-id="${r.id}" class="btn btn-sm btn-link text-danger del">Delete</button></td>`;
            tableBody.appendChild(tr);
          }
          // attach delete handlers
          document.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            await fetch(`/api/history/${id}`, { method: 'DELETE' });
            fetchHistory();
          }));
        } catch (e) {
          console.error('history fetch', e);
        }
      }

      function getWeatherIcon(cw) {
        if (!cw) return '<i class="fa-solid fa-cloud fa-lg text-secondary"></i>';
        const t = cw.temperature;
        if (t >= 25) return '<i class="fa-solid fa-sun fa-lg text-warning"></i>';
        if (t >= 10) return '<i class="fa-solid fa-cloud-sun fa-lg text-info"></i>';
        return '<i class="fa-solid fa-snowflake fa-lg text-primary"></i>';
      }

      // simple autocomplete: fetch geocode suggestions
      let acTimer = null;
      cityEl.addEventListener('input', () => {
        clearTimeout(acTimer);
        const q = cityEl.value.trim();
        if (!q) return;
        acTimer = setTimeout(async () => {
          try {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5`);
            const j = await res.json();
            datalist.innerHTML = '';
            (j.results || []).forEach(r => {
              const opt = document.createElement('option');
              opt.value = `${r.name}${r.country ? ', ' + r.country : ''}`;
              datalist.appendChild(opt);
            });
          } catch (e) {
            // ignore
          }
        }, 300);
      });

      clearBtn.addEventListener('click', async () => {
        if (!confirm('Clear all history?')) return;
        await fetch('/api/history/clear', { method: 'DELETE' });
        fetchHistory();
      });

      btn.addEventListener('click', fetchWeather);
      autoBtn.addEventListener('click', () => {
        auto = !auto;
        autoBtn.innerText = 'Auto: ' + (auto ? 'on' : 'off');
        if (auto) {
          timer = setInterval(fetchWeather, 20000);
        } else {
          clearInterval(timer);
        }
      });

      // initial load
      fetchHistory();
    </script>
  </body>
</html>
