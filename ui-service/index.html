<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="header d-flex align-items-center mb-4">
        <div>
          <h1 class="title mb-0">Weather Dashboard</h1>
          <div class="subtitle">Bright, fast and friendly • Open‑Meteo • Demo</div>
        </div>
        <div class="ms-auto">
          <button id="themeToggle" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-moon"></i></button>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-5">
          <div class="card card-weather p-3 weather-card">
            <div class="mb-2 d-flex gap-2">
              <div class="input-group flex-grow-1">
                <span class="input-group-text bg-transparent"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input id="city" class="form-control" placeholder="City (e.g. Kyiv)" list="cities" />
                <datalist id="cities"></datalist>
                <button id="btn" class="btn btn-primary">Search</button>
              </div>
            </div>
            <div id="weather" class="weather-body text-center text-dark">
              <div class="icon" id="weather-icon"><i class="fa-solid fa-cloud fa-3x text-secondary"></i></div>
              <div class="temp" id="weather-temp">—°C</div>
              <div class="loc small text-muted" id="weather-loc">No data yet</div>
              <div class="details mt-2 small text-muted" id="weather-details"></div>
              <div class="mt-3">
                <button id="favBtn" class="btn btn-outline-secondary btn-sm"><i class="fa-regular fa-star"></i> Save</button>
                <button id="refreshBtn" class="btn btn-outline-primary btn-sm ms-2"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
              </div>
            </div>
          </div>
          <div class="mt-3 card p-2">
            <h6 class="mb-2">Favorites</h6>
            <div id="favorites" class="d-flex flex-wrap gap-2"></div>
          </div>
        </div>

        <div class="col-md-7">
          <div class="card p-3 history-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="mb-0">Recent requests</h5>
              <div>
                <button id="clear" class="btn btn-sm btn-outline-danger me-2"><i class="fa-solid fa-trash"></i> Clear</button>
                <button id="download" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-download"></i> Export</button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm" id="history-table">
                <thead class="table-light"><tr><th></th><th>ID</th><th>Time</th><th>City</th><th>Params</th><th>Status</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="text-muted small">Click a row to load that request into the search. Auto-refreshes after Fetch.</div>
          </div>
        </div>
      </div>
    </div>
    
      <script>
      const btn = document.getElementById('btn');
      const cityEl = document.getElementById('city');
      const datalist = document.getElementById('cities');
      const clearBtn = document.getElementById('clear');
      const favEl = document.getElementById('favorites');
      const favBtn = document.getElementById('favBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const weatherIcon = document.getElementById('weather-icon');
      const weatherTemp = document.getElementById('weather-temp');
      const weatherLoc = document.getElementById('weather-loc');
      const weatherDetails = document.getElementById('weather-details');
      const downloadBtn = document.getElementById('download');
      const themeToggle = document.getElementById('themeToggle');
      const weatherEl = document.getElementById('weather');
      const tableBody = document.querySelector('#history-table tbody');
      let auto = false;
      let timer = null;
      let lastQuery = null;

      async function fetchWeather(query) {
        const city = (query || cityEl.value || '').trim();
        if (!city) {
          weatherLoc.innerText = 'Enter a city name.';
          return;
        }
        lastQuery = city;
        weatherEl.classList.add('loading');
        try {
          const res = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
          const json = await res.json();
          const cw = json.payload?.current_weather || null;
          const location = json.location_name || city;
          if (cw) {
            weatherIcon.innerHTML = getWeatherIconByCode(cw.weathercode, cw.temperature);
            weatherTemp.innerText = `${cw.temperature}°C`;
            weatherLoc.innerText = `${location}`;
            weatherDetails.innerText = `Wind ${cw.windspeed} m/s • Dir ${cw.winddirection}°`;
          } else {
            weatherIcon.innerHTML = '<i class="fa-solid fa-cloud fa-3x text-secondary"></i>';
            weatherTemp.innerText = '—°C';
            weatherLoc.innerText = location;
            weatherDetails.innerText = JSON.stringify(json.payload || {});
          }
          // update favorite button
          updateFavButton(location);
        } catch (e) {
          weatherLoc.innerText = 'Error fetching weather';
          weatherDetails.innerText = String(e);
        } finally {
          weatherEl.classList.remove('loading');
        }
        await fetchHistory();
      }

      async function fetchHistory() {
        try {
          const res = await fetch('/api/history/recent?limit=15');
          const rows = await res.json();
          tableBody.innerHTML = '';
          for (const r of rows) {
            const tr = document.createElement('tr');
            const icon = getWeatherIcon(r.response_body?.current_weather);
            tr.innerHTML = `
              <td class="align-middle">${icon}</td>
              <td>${r.id}</td>
              <td>${new Date(r.event_time).toLocaleString()}</td>
                  <td class="city-cell">${r.response_body?.location_name || r.query_params?.city || ''}</td>
              <td>${JSON.stringify(r.query_params)}</td>
              <td>${r.response_status} <button data-id="${r.id}" class="btn btn-sm btn-link text-danger del">Delete</button></td>`;
            tableBody.appendChild(tr);
          }
          // attach delete handlers
          document.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', async (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            await fetch(`/api/history/${id}`, { method: 'DELETE' });
            fetchHistory();
          }));
          // attach click to load
          document.querySelectorAll('#history-table tbody tr').forEach(row => {
            row.addEventListener('click', (e) => {
              const cityCell = row.querySelector('.city-cell');
              if (cityCell && cityCell.innerText) {
                cityEl.value = cityCell.innerText;
                fetchWeather(cityCell.innerText);
              }
            });
          });
        } catch (e) {
          console.error('history fetch', e);
        }
      }

      function getWeatherIcon(cw) {
        if (!cw) return '<i class="fa-solid fa-cloud fa-lg text-secondary"></i>';
        const t = cw.temperature;
        if (t >= 25) return '<i class="fa-solid fa-sun fa-lg text-warning"></i>';
        if (t >= 10) return '<i class="fa-solid fa-cloud-sun fa-lg text-info"></i>';
        return '<i class="fa-solid fa-snowflake fa-lg text-primary"></i>';
      }

      function getWeatherIconByCode(code, temp) {
        if (code === 0) return '<i class="fa-solid fa-sun fa-3x text-warning"></i>';
        if (code >= 1 && code <= 3) return '<i class="fa-solid fa-cloud-sun fa-3x text-info"></i>';
        if (code >= 45 && code <= 48) return '<i class="fa-solid fa-smog fa-3x text-secondary"></i>';
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 86)) return '<i class="fa-solid fa-cloud-showers-heavy fa-3x text-primary"></i>';
        if (code >= 71 && code <= 77) return '<i class="fa-solid fa-snowflake fa-3x text-primary"></i>';
        if (code >= 95 && code <= 99) return '<i class="fa-solid fa-bolt fa-3x text-danger"></i>';
        if (temp >= 25) return '<i class="fa-solid fa-sun fa-3x text-warning"></i>';
        if (temp >= 10) return '<i class="fa-solid fa-cloud-sun fa-3x text-info"></i>';
        return '<i class="fa-solid fa-cloud fa-3x text-secondary"></i>';
      }

      // simple autocomplete: fetch geocode suggestions
      let acTimer = null;
      cityEl.addEventListener('input', () => {
        clearTimeout(acTimer);
        const q = cityEl.value.trim();
        if (!q) return;
        acTimer = setTimeout(async () => {
          try {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5`);
            const j = await res.json();
            datalist.innerHTML = '';
            (j.results || []).forEach(r => {
              const opt = document.createElement('option');
              opt.value = `${r.name}${r.country ? ', ' + r.country : ''}`;
              datalist.appendChild(opt);
            });
          } catch (e) {
            // ignore
          }
        }, 300);
      });

      clearBtn.addEventListener('click', async () => {
        if (!confirm('Clear all history?')) return;
        await fetch('/api/history/clear', { method: 'DELETE' });
        fetchHistory();
      });

      // favorites handling in localStorage
      function loadFavorites() {
        const fav = JSON.parse(localStorage.getItem('fav_cities') || '[]');
        favEl.innerHTML = '';
        fav.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'btn btn-sm btn-outline-secondary';
          btn.innerText = c;
          btn.addEventListener('click', () => { cityEl.value = c; fetchWeather(c); });
          favEl.appendChild(btn);
        });
      }

      function updateFavButton(city) {
        const fav = JSON.parse(localStorage.getItem('fav_cities') || '[]');
        const exists = fav.includes(city);
        favBtn.innerHTML = exists ? '<i class="fa-solid fa-star"></i> Saved' : '<i class="fa-regular fa-star"></i> Save';
      }

      favBtn.addEventListener('click', () => {
        const city = lastQuery || cityEl.value;
        if (!city) return;
        const fav = JSON.parse(localStorage.getItem('fav_cities') || '[]');
        if (!fav.includes(city)) fav.push(city);
        localStorage.setItem('fav_cities', JSON.stringify(fav));
        loadFavorites();
        updateFavButton(city);
      });

      refreshBtn.addEventListener('click', () => { if (lastQuery) fetchWeather(lastQuery); });

      downloadBtn.addEventListener('click', async () => {
        const res = await fetch('/api/history/recent?limit=100');
        const rows = await res.json();
        const blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'history.json'; a.click();
      });

      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
      });

      // initial load
      loadFavorites();
      fetchHistory();

      btn.addEventListener('click', fetchWeather);
      autoBtn.addEventListener('click', () => {
        auto = !auto;
        autoBtn.innerText = 'Auto: ' + (auto ? 'on' : 'off');
        if (auto) {
          timer = setInterval(fetchWeather, 20000);
        } else {
          clearInterval(timer);
        }
      });

      // initial load
      fetchHistory();
    </script>
  </body>
</html>
