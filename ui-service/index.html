<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
      body { padding: 1.5rem; background: #f5f7fb; }
      .card-weather { min-height: 160px; }
      .loading { opacity: 0.6; }
      .aq-badge { font-size: 0.72rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="d-flex align-items-center mb-4">
          <h1 class="me-auto">Weather Dashboard</h1>
          <div class="text-muted">Demo: Open‑Meteo • FastAPI • Postgres</div>
        </div>

      <div class="row g-3 mb-3">
        <div class="col-12">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input id="city" class="form-control" placeholder="Add or refresh a city (e.g. Kyiv)" list="cities" />
            <datalist id="cities"></datalist>
            <button id="btn" class="btn btn-primary">Search</button>
          </div>
        </div>
      </div>

      <div id="citiesRow" class="row g-3 mb-4">
        <!-- one card per tracked city, rendered by renderCities() -->
      </div>

      <div class="row g-3">
        <div class="col-12">
          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="mb-0">Recent requests</h5>
              <div>
                <button id="clear" class="btn btn-sm btn-danger me-2"><i class="fa-solid fa-trash"></i> Clear</button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm" id="history-table">
                <thead class="table-light">
                  <tr><th></th><th>ID</th><th>Time</th><th>City</th><th>Temp</th><th>Humidity</th><th>NO₂</th><th>Params</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="text-muted small">Refreshes automatically every 1 hour.</div>
          </div>
        </div>
      </div>
    </div>

      <script>
      const btn = document.getElementById('btn');
      const cityEl = document.getElementById('city');
      const datalist = document.getElementById('cities');
      const clearBtn = document.getElementById('clear');
      const citiesRow = document.getElementById('citiesRow');
      const tableBody = document.querySelector('#history-table tbody');

      const cardState = {};

      function fmtNum(v, digits = 1) {
        return (v === null || v === undefined) ? '—' : Number(v).toFixed(digits);
      }

      function aqLevel(no2) {
        if (no2 == null) return 'secondary';
        if (no2 < 40) return 'success';
        if (no2 < 100) return 'warning';
        return 'danger';
      }

      function cardHtml(name, reading) {
        if (!reading) {
          return `<div class="card card-weather p-3 text-white" style="background: linear-gradient(135deg,#9aa0a6,#6c7278);">
            <div class="fw-semibold">${name}</div>
            <div class="small">Waiting for first reading…</div>
          </div>`;
        }
        const aq = reading.air_quality || {};
        return `
          <div class="card card-weather p-3 text-white" style="background: linear-gradient(135deg,#667eea,#764ba2);">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <h2 class="display-6 fw-bold mb-0">${fmtNum(reading.temperature)}°C</h2>
                <div>${name}</div>
                <div class="small opacity-75">Feels like ${fmtNum(reading.apparent_temperature)}°C</div>
              </div>
              <div class="text-end small">
                <div>Wind: ${fmtNum(reading.windspeed)} m/s</div>
                <div>Dir: ${fmtNum(reading.winddirection, 0)}°</div>
                <div>Humidity: ${fmtNum(reading.humidity, 0)}%</div>
                <div>Pressure: ${fmtNum(reading.pressure, 0)} hPa</div>
                <div>Precip: ${fmtNum(reading.precipitation, 1)} mm</div>
              </div>
            </div>
            <hr class="opacity-25 my-2">
            <div class="d-flex flex-wrap gap-2">
              <span class="badge bg-${aqLevel(aq.nitrogen_dioxide)} aq-badge">NO₂ ${fmtNum(aq.nitrogen_dioxide, 0)} µg/m³</span>
              <span class="badge bg-light text-dark aq-badge">PM2.5 ${fmtNum(aq.pm2_5, 0)}</span>
              <span class="badge bg-light text-dark aq-badge">PM10 ${fmtNum(aq.pm10, 0)}</span>
              <span class="badge bg-light text-dark aq-badge">O₃ ${fmtNum(aq.ozone, 0)}</span>
              <span class="badge bg-light text-dark aq-badge">CO ${fmtNum(aq.carbon_monoxide, 0)}</span>
            </div>
          </div>`;
      }

      function renderCitiesRow() {
        const names = Object.keys(cardState);
        citiesRow.innerHTML = names.map(name =>
          `<div class="col-md-6 col-lg-4">${cardHtml(name, cardState[name])}</div>`
        ).join('');
      }


      async function refreshTrackedCities() {
        try {
          const res = await fetch('/api/cities');
          if (!res.ok) throw new Error(`backend returned ${res.status}`);
          const json = await res.json();
          const names = json.cities || [];
          for (const name of names) {
            if (!(name in cardState)) cardState[name] = null; // placeholder until first reading arrives
          }
          await Promise.all(names.map(async (name) => {
            try {
              const r = await fetch(`/api/latest?city=${encodeURIComponent(name)}`);
              if (!r.ok) return; 
              const j = await r.json();
              cardState[name] = j.payload;
            } catch (e) { /* keep previous state */ }
          }));
          renderCitiesRow();
        } catch (e) {
          console.error('refreshTrackedCities failed', e);
        }
        await fetchHistory();
      }


      async function searchCity() {
        const city = cityEl.value.trim();
        if (!city) return;
        btn.disabled = true;
        btn.classList.add('loading');
        try {
          const res = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
          if (!res.ok) throw new Error(`backend returned ${res.status}`);
          const json = await res.json();
          cardState[json.location_name || city] = json.payload;
          renderCitiesRow();
        } catch (e) {
          console.error('search failed', e);
          alert('Could not fetch that city: ' + e.message);
        } finally {
          btn.disabled = false;
          btn.classList.remove('loading');
        }
        await fetchHistory();
      }

      async function fetchHistory() {
        try {
          const res = await fetch('/api/history/recent?limit=15');
          if (!res.ok) throw new Error(`backend returned ${res.status}`);
          const rows = await res.json();
          const frag = document.createDocumentFragment();
          for (const r of rows) {
            const reading = r.response_body || {};
            const aq = reading.air_quality || {};
            const icon = getWeatherIcon(reading);
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="align-middle">${icon}</td>
              <td>${r.id}</td>
              <td>${new Date(r.event_time).toLocaleString()}</td>
              <td>${r.query_params?.city || ''}</td>
              <td>${fmtNum(reading.temperature)}°C</td>
              <td>${fmtNum(reading.humidity, 0)}%</td>
              <td>${fmtNum(aq.nitrogen_dioxide, 0)}</td>
              <td>${JSON.stringify(r.query_params)}</td>
              <td>${r.response_status} <button data-id="${r.id}" class="btn btn-sm btn-link text-danger del">Delete</button></td>`;
            frag.appendChild(tr);
          }
          tableBody.innerHTML = '';
          tableBody.appendChild(frag);
          document.querySelectorAll('.del').forEach(b => b.addEventListener('click', async (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            await fetch(`/api/history/${id}`, { method: 'DELETE' });
            fetchHistory();
          }));
        } catch (e) {
          console.error('history fetch', e);
        }
      }

      function getWeatherIcon(reading) {
        if (!reading || reading.temperature == null) return '<i class="fa-solid fa-cloud fa-lg text-secondary"></i>';
        const t = reading.temperature;
        if (t >= 25) return '<i class="fa-solid fa-sun fa-lg text-warning"></i>';
        if (t >= 10) return '<i class="fa-solid fa-cloud-sun fa-lg text-info"></i>';
        return '<i class="fa-solid fa-snowflake fa-lg text-primary"></i>';
      }

      let acTimer = null;
      cityEl.addEventListener('input', () => {
        clearTimeout(acTimer);
        const q = cityEl.value.trim();
        if (!q) return;
        acTimer = setTimeout(async () => {
            try {
              const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
              const j = await res.json();
              datalist.innerHTML = '';
              (j.results || []).forEach(r => {
                const opt = document.createElement('option');
                opt.value = `${r.name}${r.country ? ', ' + r.country : ''}`;
                datalist.appendChild(opt);
              });
            } catch (e) {
              // ignore
            }
          }, 300);
      });

      clearBtn.addEventListener('click', async () => {
        if (!confirm('Clear all history?')) return;
        await fetch('/api/history/clear', { method: 'DELETE' });
        fetchHistory();
      });

      btn.addEventListener('click', searchCity);
      cityEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchCity(); });


      refreshTrackedCities();
      setInterval(refreshTrackedCities, 3600000);
    </script>
  </body>
</html>
