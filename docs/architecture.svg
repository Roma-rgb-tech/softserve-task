<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 940" width="1520" height="940" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b6b7f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmqp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#e0705a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowExt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#4fa88b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1520" height="940" fill="#f7fafc"/>

  <!-- title -->
  <text x="40" y="46" font-size="24" font-weight="600" fill="#1f2d3d">Skyline — weather monitoring</text>
  <text x="40" y="72" font-size="14" fill="#5b6b7f">5 Vagrant VMs bridged onto the home LAN · one Docker Compose stack per VM</text>

  <!-- ================= external ================= -->
  <rect x="1150" y="36" width="300" height="86" rx="12" fill="#eaf6f1" stroke="#4fa88b" stroke-width="1.5"/>
  <text x="1300" y="66" font-size="15" font-weight="600" fill="#1f2d3d" text-anchor="middle">Open-Meteo (public API)</text>
  <text x="1300" y="88" font-size="12" fill="#5b6b7f" text-anchor="middle">forecast · air-quality · geocoding</text>
  <text x="1300" y="107" font-size="11" fill="#4fa88b" text-anchor="middle">outside the LAN — internet</text>

  <!-- ================= LAN boundary ================= -->
  <rect x="150" y="160" width="1310" height="710" rx="18" fill="#ffffff" stroke="#b6c6d6" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="172" y="188" font-size="14" font-weight="600" fill="#5b6b7f">Home LAN · 192.168.88.0/24 (bridged, static addresses outside the DHCP pool)</text>

  <!-- ================= client ================= -->
  <rect x="176" y="486" width="136" height="112" rx="12" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.5"/>
  <text x="244" y="516" font-size="14" font-weight="600" fill="#1f2d3d" text-anchor="middle">Browser</text>
  <text x="244" y="536" font-size="12" fill="#5b6b7f" text-anchor="middle">laptop / phone</text>
  <text x="244" y="562" font-size="11" fill="#8b9aad" text-anchor="middle">any device</text>
  <text x="244" y="578" font-size="11" fill="#8b9aad" text-anchor="middle">on the router</text>

  <!-- ================= VM: ui ================= -->
  <rect x="356" y="466" width="212" height="152" rx="12" fill="#f4f8fc" stroke="#7f9ab5" stroke-width="1.8"/>
  <text x="462" y="492" font-size="14" font-weight="600" fill="#1f2d3d" text-anchor="middle">VM · ui</text>
  <text x="462" y="510" font-size="12" fill="#e0705a" text-anchor="middle" font-family="monospace">192.168.88.204</text>
  <rect x="374" y="524" width="176" height="76" rx="9" fill="#ffffff" stroke="#c3d1e0" stroke-width="1.4"/>
  <text x="462" y="548" font-size="13" font-weight="600" fill="#1f2d3d" text-anchor="middle">ui-service</text>
  <text x="462" y="566" font-size="11" fill="#5b6b7f" text-anchor="middle">nginx + dashboard</text>
  <text x="462" y="586" font-size="11" fill="#8b9aad" text-anchor="middle" font-family="monospace">:80</text>

  <!-- ================= VM: backend ================= -->
  <rect x="616" y="466" width="212" height="152" rx="12" fill="#f4f8fc" stroke="#7f9ab5" stroke-width="1.8"/>
  <text x="722" y="492" font-size="14" font-weight="600" fill="#1f2d3d" text-anchor="middle">VM · backend</text>
  <text x="722" y="510" font-size="12" fill="#e0705a" text-anchor="middle" font-family="monospace">192.168.88.202</text>
  <rect x="634" y="524" width="176" height="76" rx="9" fill="#ffffff" stroke="#c3d1e0" stroke-width="1.4"/>
  <text x="722" y="548" font-size="13" font-weight="600" fill="#1f2d3d" text-anchor="middle">backend-service</text>
  <text x="722" y="566" font-size="11" fill="#5b6b7f" text-anchor="middle">consumer + sessions + reads</text>
  <text x="722" y="586" font-size="11" fill="#8b9aad" text-anchor="middle" font-family="monospace">:8000</text>

  <!-- ================= VM: history ================= -->
  <rect x="876" y="466" width="212" height="152" rx="12" fill="#f4f8fc" stroke="#7f9ab5" stroke-width="1.8"/>
  <text x="982" y="492" font-size="14" font-weight="600" fill="#1f2d3d" text-anchor="middle">VM · history</text>
  <text x="982" y="510" font-size="12" fill="#e0705a" text-anchor="middle" font-family="monospace">192.168.88.201</text>
  <rect x="894" y="524" width="176" height="76" rx="9" fill="#ffffff" stroke="#c3d1e0" stroke-width="1.4"/>
  <text x="982" y="546" font-size="13" font-weight="600" fill="#1f2d3d" text-anchor="middle">history-service</text>
  <text x="982" y="564" font-size="11" fill="#5b6b7f" text-anchor="middle">persistence</text>
  <text x="982" y="580" font-size="11" fill="#5b6b7f" text-anchor="middle">+ persistence</text>
  <text x="982" y="596" font-size="11" fill="#8b9aad" text-anchor="middle" font-family="monospace">:8001</text>

  <!-- ================= VM: fetcher ================= -->
  <rect x="1140" y="200" width="300" height="146" rx="12" fill="#f4f8fc" stroke="#7f9ab5" stroke-width="1.8"/>
  <text x="1290" y="226" font-size="14" font-weight="600" fill="#1f2d3d" text-anchor="middle">VM · fetcher</text>
  <text x="1290" y="244" font-size="12" fill="#e0705a" text-anchor="middle" font-family="monospace">192.168.88.203</text>
  <rect x="1158" y="258" width="264" height="72" rx="9" fill="#ffffff" stroke="#c3d1e0" stroke-width="1.4"/>
  <text x="1290" y="280" font-size="13" font-weight="600" fill="#1f2d3d" text-anchor="middle">fetcher-service</text>
  <text x="1290" y="298" font-size="11" fill="#5b6b7f" text-anchor="middle">hourly poller · the only service</text>
  <text x="1290" y="313" font-size="11" fill="#5b6b7f" text-anchor="middle">that calls the public API</text>
  <text x="1290" y="327" font-size="11" fill="#8b9aad" text-anchor="middle" font-family="monospace">:8002 (health only)</text>

  <!-- ================= VM: infra ================= -->
  <rect x="1140" y="404" width="300" height="330" rx="12" fill="#f4f8fc" stroke="#7f9ab5" stroke-width="1.8"/>
  <text x="1290" y="430" font-size="14" font-weight="600" fill="#1f2d3d" text-anchor="middle">VM · postgres (infrastructure)</text>
  <text x="1290" y="448" font-size="12" fill="#e0705a" text-anchor="middle" font-family="monospace">192.168.88.200</text>

  <rect x="1158" y="462" width="264" height="72" rx="9" fill="#ffffff" stroke="#c3d1e0" stroke-width="1.4"/>
  <text x="1290" y="484" font-size="13" font-weight="600" fill="#1f2d3d" text-anchor="middle">postgres:15</text>
  <text x="1290" y="502" font-size="11" fill="#5b6b7f" text-anchor="middle">requests_history · named volume</text>
  <text x="1290" y="521" font-size="11" fill="#8b9aad" text-anchor="middle" font-family="monospace">:5432</text>

  <rect x="1158" y="546" width="264" height="62" rx="9" fill="#ffffff" stroke="#c3d1e0" stroke-width="1.4"/>
  <text x="1290" y="568" font-size="13" font-weight="600" fill="#1f2d3d" text-anchor="middle">redis:7</text>
  <text x="1290" y="585" font-size="11" fill="#5b6b7f" text-anchor="middle">UI session state</text>
  <text x="1290" y="601" font-size="11" fill="#8b9aad" text-anchor="middle" font-family="monospace">:6379</text>

  <rect x="1158" y="620" width="264" height="72" rx="9" fill="#ffffff" stroke="#c3d1e0" stroke-width="1.4"/>
  <text x="1290" y="642" font-size="13" font-weight="600" fill="#1f2d3d" text-anchor="middle">rabbitmq:3</text>
  <text x="1290" y="659" font-size="11" fill="#5b6b7f" text-anchor="middle">durable queue weather.events</text>
  <text x="1290" y="678" font-size="11" fill="#8b9aad" text-anchor="middle" font-family="monospace">:5672 · :15672 (UI)</text>

  <!-- ================= links ================= -->

  <!-- browser -> ui -->
  <line x1="312" y1="542" x2="350" y2="542" stroke="#5b6b7f" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="331" y="530" font-size="10.5" fill="#5b6b7f" text-anchor="middle">HTTP :80</text>
  <text x="331" y="562" font-size="10" fill="#8b9aad" text-anchor="middle">page</text>

  <!-- ui -> backend -->
  <line x1="568" y1="542" x2="610" y2="542" stroke="#5b6b7f" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="589" y="524" font-size="10.5" fill="#5b6b7f" text-anchor="middle">HTTP :8000</text>
  <text x="589" y="562" font-size="10" fill="#8b9aad" text-anchor="middle">/api/* proxy</text>
  <text x="589" y="576" font-size="10" fill="#8b9aad" text-anchor="middle">readings · session</text>

  <!-- backend -> history -->
  <line x1="828" y1="530" x2="870" y2="530" stroke="#5b6b7f" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="849" y="512" font-size="10.5" fill="#5b6b7f" text-anchor="middle">HTTP :8001</text>
  <text x="849" y="552" font-size="10" fill="#8b9aad" text-anchor="middle">stored rows</text>

  <!-- backend -> redis -->
  <path d="M722 618 V706 H1122 V577 H1152" fill="none" stroke="#5b6b7f" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="820" y="724" font-size="10.5" fill="#5b6b7f" text-anchor="middle">Redis :6379 — session cookie id →</text>
  <text x="820" y="739" font-size="10.5" fill="#5b6b7f" text-anchor="middle">{period, featured city, filter, page size}</text>

  <!-- history -> postgres -->
  <path d="M1088 492 H1116 V498 H1152" fill="none" stroke="#5b6b7f" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="1090" y="474" font-size="10.5" fill="#5b6b7f" text-anchor="end">SQL :5432</text>

  <!-- fetcher -> open-meteo -->
  <line x1="1290" y1="198" x2="1290" y2="128" stroke="#4fa88b" stroke-width="1.8" marker-end="url(#arrowExt)"/>
  <text x="1302" y="166" font-size="10.5" fill="#4fa88b">HTTPS · once per hour per city</text>

  <!-- fetcher -> rabbitmq (publish) -->
  <path d="M1160 340 H1105 V656 H1152" fill="none" stroke="#e0705a" stroke-width="2" marker-end="url(#arrowAmqp)"/>
  <text x="1096" y="392" font-size="10.5" fill="#e0705a" text-anchor="end">AMQP publish</text>
  <text x="1096" y="407" font-size="10" fill="#e0705a" text-anchor="end">persistent message:</text>
  <text x="1096" y="421" font-size="10" fill="#e0705a" text-anchor="end">city, coords, temp, humidity,</text>
  <text x="1096" y="435" font-size="10" fill="#e0705a" text-anchor="end">pressure, wind, air quality,</text>
  <text x="1096" y="449" font-size="10" fill="#e0705a" text-anchor="end">collected_at</text>

  <!-- rabbitmq -> history (consume) -->
  <path d="M1152 690 H1000 V620" fill="none" stroke="#e0705a" stroke-width="2" marker-end="url(#arrowAmqp)"/>
  <text x="1076" y="682" font-size="10.5" fill="#e0705a" text-anchor="middle">AMQP consume</text>

  <!-- ================= notes ================= -->
  <rect x="176" y="640" width="392" height="196" rx="12" fill="#fbfdff" stroke="#d6e0ea" stroke-width="1.3"/>
  <text x="196" y="668" font-size="13" font-weight="600" fill="#1f2d3d">How the flow works</text>
  <text x="196" y="692" font-size="11.5" fill="#5b6b7f">1. Fetcher polls Open-Meteo on its own clock (1 h).</text>
  <text x="196" y="712" font-size="11.5" fill="#5b6b7f">2. It publishes each reading to the durable queue.</text>
  <text x="196" y="732" font-size="11.5" fill="#5b6b7f">3. History consumes and appends it to Postgres.</text>
  <text x="196" y="752" font-size="11.5" fill="#5b6b7f">4. Backend serves stored rows to the UI and keeps</text>
  <text x="210" y="768" font-size="11.5" fill="#5b6b7f">display preferences in Redis.</text>
  <text x="196" y="794" font-size="11.5" fill="#1f2d3d" font-weight="600">No UI action ever triggers an external fetch,</text>
  <text x="196" y="812" font-size="11.5" fill="#1f2d3d" font-weight="600">and the history has no write or delete endpoint.</text>

  <!-- legend -->
  <rect x="600" y="756" width="470" height="80" rx="12" fill="#fbfdff" stroke="#d6e0ea" stroke-width="1.3"/>
  <line x1="620" y1="784" x2="664" y2="784" stroke="#5b6b7f" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="674" y="788" font-size="11.5" fill="#5b6b7f">synchronous HTTP / SQL (reads)</text>
  <line x1="620" y1="812" x2="664" y2="812" stroke="#e0705a" stroke-width="2" marker-end="url(#arrowAmqp)"/>
  <text x="674" y="816" font-size="11.5" fill="#5b6b7f">asynchronous AMQP (the write path)</text>
  <line x1="900" y1="784" x2="944" y2="784" stroke="#4fa88b" stroke-width="1.8" marker-end="url(#arrowExt)"/>
  <text x="954" y="788" font-size="11.5" fill="#5b6b7f">outbound to the internet</text>
  <line x1="900" y1="812" x2="944" y2="812" stroke="#5b6b7f" stroke-width="1.7" stroke-dasharray="5 4"/>
  <text x="954" y="816" font-size="11.5" fill="#5b6b7f">session state (not business data)</text>

  <text x="150" y="900" font-size="11" fill="#8b9aad">Each VM runs its own docker-compose stack from provision/&lt;vm&gt;/ — no Swarm, no cluster-wide orchestration. Containers publish ports; cross-VM traffic goes over the LAN by IP.</text>
</svg>
