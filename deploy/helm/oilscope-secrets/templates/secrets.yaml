{{- $k := .Values.keys -}}
{{- $db := .Values.database -}}
{{- $refresh := .Values.refreshInterval -}}
{{- $user := required "registry.username is required" .Values.registry.username -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oilscope-registry
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: oilscope-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf `{"auths":{%q:{"username":%q,"password":"{{ .token }}","auth":"{{ printf "%%s:%%s" %q .token | b64enc }}"}}}` .Values.registry.host $user $user | squote }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ required "keys.ghcrToken is required" $k.ghcrToken }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $db.cluster }}-app-user
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: {{ $db.cluster }}-app-user
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ $db.user | quote }}
        password: '{{ "{{ .password }}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "keys.postgresPassword is required" $k.postgresPassword }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oilscope-redis
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: oilscope-redis
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        redis-password: '{{ "{{ .password }}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "keys.redisPassword is required" $k.redisPassword }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oilscope-app
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: oilscope-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        {{- $where := printf "%s:5432/%s?sslmode=require" $db.host $db.name }}
        HISTORY_DATABASE_URL: {{ printf "postgresql+psycopg://%s:{{ .postgres | urlquery }}@%s" $db.user $where | squote }}
        FETCHER_DATABASE_URL: {{ printf "postgres://%s:{{ .postgres | urlquery }}@%s" $db.user $where | squote }}
        UI_DATABASE_URL: {{ printf "postgresql://%s:{{ .postgres | urlquery }}@%s" $db.user $where | squote }}
        REDIS_URL: {{ printf "redis://:{{ .redis | urlquery }}@%s:6379/0" .Values.redis.host | squote }}
        OILPRICEAPI_KEY: '{{ "{{ .oilprice }}" }}'
  data:
    - secretKey: postgres
      remoteRef:
        key: {{ $k.postgresPassword }}
    - secretKey: redis
      remoteRef:
        key: {{ required "keys.redisPassword is required" $k.redisPassword }}
    - secretKey: oilprice
      remoteRef:
        key: {{ required "keys.oilpriceApiKey is required" $k.oilpriceApiKey }}
