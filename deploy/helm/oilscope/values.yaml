# SPDX-License-Identifier: GPL-2.0-or-later
# The hostname comes from the project configuration: Ansible passes it to
# `helm template`, or writes it into the Argo CD Application when GitOps is on.
#
# With GitOps the image tag below is the release that runs: the "Publish
# application images" workflow commits the new tag here after it pushes the
# images, and Argo CD rolls it out. Without GitOps Ansible overrides it with
# registry.image_sha from the project configuration.

image:
  # Each service is <repository>/<service>:<tag>.
  repository: ghcr.io/ua-academy-projects/push-and-pray
  tag: "647cc3da2ae3e82cc204cfc6879fa8e77012d58b"

# The public hostname the UI answers on.
hostname: ""

# Secrets the cluster_app role creates before the chart is applied.
imagePullSecret: oilscope-registry
appSecret: oilscope-app

tls:
  clusterIssuer: letsencrypt
  secretName: oilscope-tls

replicas: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# Migrations run as an Argo CD PreSync hook, so a new tag migrates the
# database before the services roll. Without GitOps the cluster_app role runs
# them itself and turns this off.
migrations:
  enabled: true
  database:
    host: oilscope-db-rw
    name: oil_tracker
    # The CloudNativePG role's credentials (basic-auth: username, password).
    userSecret: oilscope-db-app-user
  # The database image runs psql as the postgres user.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

services:
  history:
    port: 8001
    metricsPort: 9100
    databaseUrlKey: HISTORY_DATABASE_URL
    secretEnv: {}
    env:
      METRICS_PORT: "9100"
      QUEUE_BACKEND: pgmq
      PGMQ_QUEUE: price_observations
      PGMQ_VISIBILITY_TIMEOUT_SECONDS: "60"
      PGMQ_POLL_INTERVAL_SECONDS: "1"
      PGMQ_MAX_ATTEMPTS: "5"
      LOG_LEVEL: INFO
      TZ: UTC

  fetcher:
    port: 8002
    metricsPort: null
    databaseUrlKey: FETCHER_DATABASE_URL
    secretEnv:
      OILPRICEAPI_KEY: OILPRICEAPI_KEY
    env:
      QUEUE_BACKEND: pgmq
      PGMQ_QUEUE: price_observations
      DATA_PROVIDER: oilpriceapi
      FETCH_CRON_HOURS: "0,6,12,18"
      FETCH_TIMEZONE: UTC
      FETCH_ON_STARTUP: "true"
      REQUEST_TIMEOUT_SECONDS: "15"
      LISTEN_ADDRESS: "0.0.0.0:8002"
      TZ: UTC

  ui:
    port: 8080
    metricsPort: 9100
    databaseUrlKey: UI_DATABASE_URL
    secretEnv:
      REDIS_URL: REDIS_URL
    env:
      METRICS_PORT: "9100"
      HISTORY_SERVICE_URL: "http://history:8001"
      SESSION_BACKEND: redis
      SESSION_TTL_SECONDS: "2592000"
      SESSION_COOKIE_SECURE: "true"
      LOG_LEVEL: INFO
      TZ: UTC
