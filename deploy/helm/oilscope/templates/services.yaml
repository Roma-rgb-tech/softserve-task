{{- $root := . -}}
{{- $image := printf "%s/%%s:%s"
      (required "image.repository is required" .Values.image.repository)
      (required "image.tag is required" .Values.image.tag) -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: oilscope
spec:
  replicas: {{ $root.Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: oilscope
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        - name: {{ $root.Values.imagePullSecret }}
      containers:
        - name: {{ $name }}
          image: {{ printf $image $name | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if $svc.metricsPort }}
            - name: metrics
              containerPort: {{ $svc.metricsPort }}
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.appSecret }}
                  key: {{ $svc.databaseUrlKey }}
            {{- range $env, $key := $svc.secretEnv }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.appSecret }}
                  key: {{ $key }}
            {{- end }}
            {{- range $env, $value := $svc.env }}
            - name: {{ $env }}
              value: {{ $value | toString | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: oilscope
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
    {{- if $svc.metricsPort }}
    - name: metrics
      port: {{ $svc.metricsPort }}
      targetPort: metrics
    {{- end }}
{{- end }}
