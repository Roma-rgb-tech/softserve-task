---
- name: Access each mapped secret's current value from the controller
  ansible.builtin.command:
    argv:
      - "{{ resolve_secrets_aws }}"
      - secretsmanager
      - get-secret-value
      - --secret-id
      - "{{ item.value }}"
      - --region
      - "{{ resolve_secrets_config.catalog.region.aws[resolve_secrets_config.default_region] }}"
      - --query
      - SecretString
      - --output
      - text
  register: resolve_secrets_accessed
  changed_when: false
  check_mode: false
  no_log: true
  loop: "{{ resolve_secrets_mappings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Build the resolved secrets mapping
  ansible.builtin.set_fact:
    resolve_secrets_result: >-
      {{ resolve_secrets_result | default({}) | combine({
           item.item.key: item.stdout
         }) }}
  no_log: true
  loop: "{{ resolve_secrets_accessed.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
