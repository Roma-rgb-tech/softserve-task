---
- name: Ask GCP where the Private Service Connect endpoint answers
  ansible.builtin.command:
    argv:
      - "{{ database_endpoint_gcloud }}"
      - compute
      - addresses
      - describe
      - "{{ oilscope_database_instance }}-endpoint"
      - --project
      - "{{ oilscope_gcp_project }}"
      - --region
      - "{{ oilscope_gcp_region }}"
      - --format
      - value(address)
  delegate_to: localhost
  become: false
  run_once: true
  register: database_endpoint_psc
  changed_when: false
  check_mode: false

- name: Point the workloads at the Private Service Connect endpoint
  ansible.builtin.set_fact:
    oilscope_database_host: "{{ database_endpoint_psc.stdout | trim }}"

- name: Refuse to deploy against a database that was not found
  ansible.builtin.fail:
    msg: >-
      gcloud returned no PSC endpoint address for
      {{ oilscope_database_instance }}-endpoint in {{ oilscope_gcp_region }}.
      Run terraform apply before deploying, or turn database.managed off in
      the project configuration.
  when: database_endpoint_psc.stdout | trim | length == 0
