---
- name: Ask RDS where the instance answers
  ansible.builtin.command:
    argv:
      - "{{ database_endpoint_aws }}"
      - rds
      - describe-db-instances
      - --db-instance-identifier
      - "{{ oilscope_database_instance }}"
      - --region
      - "{{ oilscope_aws_region }}"
      - --query
      - DBInstances[0].Endpoint.Address
      - --output
      - text
  delegate_to: localhost
  become: false
  run_once: true
  register: database_endpoint_rds
  changed_when: false
  check_mode: false

- name: Point the workloads at the RDS endpoint
  ansible.builtin.set_fact:
    oilscope_database_host: "{{ database_endpoint_rds.stdout | trim }}"

- name: Refuse to deploy against a database that was not found
  ansible.builtin.fail:
    msg: >-
      RDS returned no endpoint for {{ oilscope_database_instance }} in
      {{ oilscope_aws_region }}. Run terraform apply before deploying, or turn
      database.managed off in the project configuration.
  when: oilscope_database_host | length == 0 or oilscope_database_host == 'None'
