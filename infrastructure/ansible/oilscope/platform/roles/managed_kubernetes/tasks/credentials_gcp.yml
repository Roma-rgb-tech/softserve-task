---
- name: Check for the GKE authentication plugin
  ansible.builtin.command:
    argv:
      - gke-gcloud-auth-plugin
      - --version
  register: managed_kubernetes_gke_plugin
  changed_when: false
  check_mode: false
  failed_when: false

- name: Refuse to continue without it
  ansible.builtin.fail:
    msg: >-
      gke-gcloud-auth-plugin is not installed. Install it with
      "gcloud components install gke-gcloud-auth-plugin" (or, with Homebrew's
      gcloud, the same command), then run the playbook again.
  when: managed_kubernetes_gke_plugin.rc != 0

- name: Write the GKE credentials into the stand's kubeconfig
  ansible.builtin.command:
    argv:
      - "{{ managed_kubernetes_gcloud }}"
      - container
      - clusters
      - get-credentials
      - "{{ managed_kubernetes_name }}"
      - --zone
      - "{{ managed_kubernetes_gcp_zone }}"
      - --project
      - "{{ managed_kubernetes_gcp_project }}"
  environment:
    KUBECONFIG: "{{ managed_kubernetes_kubeconfig }}"
  changed_when: false

- name: Remember the context gcloud named
  ansible.builtin.set_fact:
    managed_kubernetes_context: >-
      gke_{{ managed_kubernetes_gcp_project }}_{{ managed_kubernetes_gcp_zone }}_{{ managed_kubernetes_name }}
