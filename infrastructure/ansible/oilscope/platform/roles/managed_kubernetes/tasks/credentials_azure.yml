---
# Without Entra ID integration the user credentials are a client certificate
# with full rights, so the kubeconfig needs no kubelogin.
- name: Write the AKS credentials into the stand's kubeconfig
  ansible.builtin.command:
    argv:
      - "{{ managed_kubernetes_az }}"
      - aks
      - get-credentials
      - --resource-group
      - "{{ managed_kubernetes_azure_resource_group }}"
      - --name
      - "{{ managed_kubernetes_name }}"
      - --subscription
      - "{{ managed_kubernetes_azure_subscription }}"
      - --file
      - "{{ managed_kubernetes_kubeconfig }}"
      - --context
      - "{{ managed_kubernetes_name }}"
      - --overwrite-existing
  changed_when: false
  no_log: true

- name: Remember the context
  ansible.builtin.set_fact:
    managed_kubernetes_context: "{{ managed_kubernetes_name }}"
