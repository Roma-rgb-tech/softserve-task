---
- name: Write the EKS credentials into the stand's kubeconfig
  ansible.builtin.command:
    argv:
      - "{{ managed_kubernetes_aws }}"
      - eks
      - update-kubeconfig
      - --name
      - "{{ managed_kubernetes_name }}"
      - --region
      - "{{ managed_kubernetes_aws_region }}"
      - --kubeconfig
      - "{{ managed_kubernetes_kubeconfig }}"
      - --alias
      - "{{ managed_kubernetes_name }}"
  changed_when: false

- name: Remember the context
  ansible.builtin.set_fact:
    managed_kubernetes_context: "{{ managed_kubernetes_name }}"
