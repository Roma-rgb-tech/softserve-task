---
- name: Fetch the CloudWatch agent package
  become: true
  ansible.builtin.get_url:
    url: "{{ monitoring_agent_cloudwatch_package_url }}"
    dest: /usr/local/src/amazon-cloudwatch-agent.deb
    owner: root
    group: root
    mode: "0644"

- name: Install the CloudWatch agent
  become: true
  ansible.builtin.apt:
    deb: /usr/local/src/amazon-cloudwatch-agent.deb

- name: Create the directory for the CloudWatch agent source configuration
  become: true
  ansible.builtin.file:
    path: "{{ monitoring_agent_cloudwatch_source | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# fetch-config consumes the file it is given and rewrites the agent's own
# etc directory, so a template kept there differs on every run. The source
# lives outside the agent's tree and is only read by fetch-config.
- name: Configure the CloudWatch agent
  become: true
  ansible.builtin.template:
    src: cloudwatch-agent.json.j2
    dest: "{{ monitoring_agent_cloudwatch_source }}"
    owner: root
    group: root
    mode: "0644"
  notify: Load the CloudWatch agent configuration

- name: Apply a pending configuration change
  ansible.builtin.meta: flush_handlers

- name: Enable the CloudWatch agent
  become: true
  ansible.builtin.systemd_service:
    name: amazon-cloudwatch-agent
    enabled: true
    state: started
