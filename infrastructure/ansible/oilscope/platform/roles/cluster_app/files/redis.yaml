---
# One Redis without replicas: it holds UI sessions, which nobody misses after a
# restart. The password comes from the Secret the role creates first.
architecture: standalone

auth:
  enabled: true
  existingSecret: oilscope-redis
  existingSecretPasswordKey: redis-password

image:
  repository: bitnamilegacy/redis

global:
  security:
    allowInsecureImages: true

master:
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
