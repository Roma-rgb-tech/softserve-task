---
architecture: standalone

auth:
  enabled: true
  existingSecret: oilscope-redis
  existingSecretPasswordKey: redis-password

image:
  repository: bitnamilegacy/redis

global:
  security:
    allowInsecureImages: true

master:
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
