---
- name: Ask Azure for the stand's key vault
  ansible.builtin.command:
    argv:
      - "{{ cluster_app_az }}"
      - keyvault
      - list
      - --resource-group
      - "{{ oilscope_azure_resource_group }}"
      - --subscription
      - "{{ oilscope_azure_subscription }}"
      - --query
      - "[].properties.vaultUri"
      - --output
      - tsv
  register: cluster_app_vaults
  changed_when: false
  check_mode: false

- name: Ask Azure for the tenant and the External Secrets identity
  ansible.builtin.command:
    argv:
      - "{{ cluster_app_az }}"
      - identity
      - show
      - --resource-group
      - "{{ oilscope_azure_resource_group }}"
      - --subscription
      - "{{ oilscope_azure_subscription }}"
      - --name
      - "{{ cluster_app_external_secrets_identity }}"
      - --query
      - "{clientId: clientId, tenantId: tenantId}"
      - --output
      - json
  register: cluster_app_identity
  changed_when: false
  check_mode: false
  failed_when: false

- name: Refuse to continue without the vault and the identity
  ansible.builtin.assert:
    that:
      - (cluster_app_vaults.stdout | trim).splitlines() | select | list | length == 1
      - cluster_app_identity.rc == 0
      - cluster_app_secret_mappings.keys()
        | intersect(['GHCR_TOKEN', 'POSTGRES_PASSWORD', 'REDIS_PASSWORD', 'OILPRICEAPI_KEY'])
        | length == 4
    fail_msg: >-
      External Secrets needs the stand's one key vault and the managed identity
      {{ cluster_app_external_secrets_identity }} in {{ oilscope_azure_resource_group }}.
      Terraform creates the identity when kubernetes.gitops.enabled is true:
      run terraform apply first. The secret_mappings of
      {{ oilscope_secrets_vm | trim }} must name GHCR_TOKEN, POSTGRES_PASSWORD,
      REDIS_PASSWORD and OILPRICEAPI_KEY.
    quiet: true

- name: Describe the Key Vault secrets to copy
  ansible.builtin.set_fact:
    cluster_app_secrets_values:
      azure:
        vaultUrl: "{{ cluster_app_vaults.stdout | trim }}"
        tenantId: "{{ (cluster_app_identity.stdout | from_json).tenantId }}"
        clientId: "{{ (cluster_app_identity.stdout | from_json).clientId }}"
      keys:
        ghcrToken: "{{ cluster_app_secret_mappings.GHCR_TOKEN }}"
        postgresPassword: "{{ cluster_app_secret_mappings.POSTGRES_PASSWORD }}"
        redisPassword: "{{ cluster_app_secret_mappings.REDIS_PASSWORD }}"
        oilpriceApiKey: "{{ cluster_app_secret_mappings.OILPRICEAPI_KEY }}"
      registry:
        host: "{{ cluster_app_registry_host }}"
        username: "{{ cluster_app_registry_user }}"
      database:
        cluster: "{{ cluster_app_database_cluster }}"
        host: "{{ cluster_app_database_host }}"
        name: "{{ cluster_app_database_name }}"
        user: "{{ cluster_app_database_user }}"
      redis:
        host: "{{ cluster_app_redis_host }}"
