---
- name: Refuse to run without the values the cluster needs
  ansible.builtin.assert:
    that:
      - cluster_app_secrets[item] | default('') | length > 0
    fail_msg: >-
      {{ item }} was not resolved. Map it in the secret_mappings of
      {{ oilscope_secrets_host }} and make sure its container holds a value.
    quiet: true
  loop:
    - POSTGRES_PASSWORD
    - REDIS_PASSWORD
    - GHCR_TOKEN
    - OILPRICEAPI_KEY

- name: Refuse to turn GitOps on without a repository and a revision
  ansible.builtin.assert:
    that:
      - cluster_app_gitops_repo_url | length > 0
      - cluster_app_gitops_revision | length > 0
    fail_msg: >-
      kubernetes.gitops.enabled is true, so Argo CD deploys the services from
      Git. Set kubernetes.gitops.repo_url (an https:// clone URL Argo CD can
      read) and kubernetes.gitops.revision (the branch or tag to follow).
    quiet: true
  when: cluster_app_gitops | bool

- name: Refuse to run without the chart
  ansible.builtin.stat:
    path: "{{ cluster_app_chart_path }}/Chart.yaml"
  register: cluster_app_chart
  failed_when: not cluster_app_chart.stat.exists
  when: not cluster_app_gitops | bool

- name: Refuse to run without a public hostname
  ansible.builtin.assert:
    that:
      - cluster_app_endpoint.hostname | default('') | length > 0
    fail_msg: >-
      Give one k3s node a public_endpoint with the hostname the site answers
      on. With a managed cluster the entry stays in vms for exactly this.
    quiet: true

- name: Build the connection strings
  ansible.builtin.set_fact:
    cluster_app_password_url: >-
      {{ cluster_app_secrets.POSTGRES_PASSWORD | urlencode | replace('/', '%2F') }}
    cluster_app_redis_password_url: >-
      {{ cluster_app_secrets.REDIS_PASSWORD | urlencode | replace('/', '%2F') }}
  no_log: true

- name: Create the application namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ cluster_app_namespace }}"

- name: Hand the resolved values to the cluster as Secrets
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    state: present
    template: secrets.yaml.j2
  no_log: true

- name: Install Redis for the UI sessions
  kubernetes.core.helm:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    name: "{{ cluster_app_redis_release }}"
    chart_ref: "{{ cluster_app_redis_chart }}"
    chart_version: "{{ cluster_app_redis_version }}"
    release_namespace: "{{ cluster_app_namespace }}"
    values_files:
      - "{{ role_path }}/files/redis.yaml"
    wait: true

- name: Create the PostgreSQL cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    state: present
    template: database.yaml.j2

- name: Wait for the primary and its replicas
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ cluster_app_database_cluster }}"
    namespace: "{{ cluster_app_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ cluster_app_wait_timeout }}"

- name: Apply the database migrations
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    state: present
    template: migrate.yaml.j2

- name: Wait for the migrations to finish
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    api_version: batch/v1
    kind: Job
    name: "migrate-{{ cluster_app_image_tag[:12] }}"
    namespace: "{{ cluster_app_namespace }}"
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: "{{ cluster_app_wait_timeout }}"

- name: Render the services from the chart
  kubernetes.core.helm_template:
    chart_ref: "{{ cluster_app_chart_path }}"
    release_name: oilscope
    release_namespace: "{{ cluster_app_namespace }}"
    release_values: "{{ cluster_app_chart_values }}"
  register: cluster_app_rendered
  when: not cluster_app_gitops | bool

- name: Deploy the services and publish the UI
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    state: present
    namespace: "{{ cluster_app_namespace }}"
    definition: "{{ cluster_app_rendered.stdout | from_yaml_all | select | list }}"
    wait: true
    wait_timeout: "{{ cluster_app_wait_timeout }}"
  when: not cluster_app_gitops | bool

- name: Hand the services to Argo CD
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    state: present
    template: argocd-application.yaml.j2
  when: cluster_app_gitops | bool

- name: Wait until Argo CD has synced the services and they are healthy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ cluster_app_gitops_application }}"
    namespace: "{{ cluster_app_gitops_namespace }}"
  register: cluster_app_application
  until:
    - cluster_app_application.resources | length > 0
    - (cluster_app_application.resources[0].status.sync.status | default('')) == 'Synced'
    - (cluster_app_application.resources[0].status.health.status | default('')) == 'Healthy'
  retries: "{{ (cluster_app_wait_timeout | int / 10) | int }}"
  delay: 10
  when: cluster_app_gitops | bool

- name: Scrape the services and the database, and add the dashboard
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    state: present
    template: monitors.yaml.j2

- name: Deploy Homepage
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_app_kubeconfig }}"
    state: present
    template: homepage.yaml.j2
    wait: true
    wait_timeout: "{{ cluster_app_wait_timeout }}"

- name: Say where everything answers
  ansible.builtin.debug:
    msg:
      - "Site: https://{{ cluster_app_endpoint.hostname }}"
      - "Homepage (tailnet only): http://homepage.{{ cluster_app_internal_domain }}"
      - "Headlamp (tailnet only): http://headlamp.{{ cluster_app_internal_domain }}"
      - "Grafana (tailnet only): http://grafana.{{ cluster_app_internal_domain }}"
      - "{{ ('Argo CD (tailnet only): http://argocd.' ~ cluster_app_internal_domain
            ~ ' - follows ' ~ cluster_app_gitops_revision ~ ' of ' ~ cluster_app_gitops_repo_url)
           if cluster_app_gitops | bool else 'Argo CD: off, the services were applied by Ansible' }}"
