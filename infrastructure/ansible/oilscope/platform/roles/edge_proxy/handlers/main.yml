---
- name: Restart Traefik
  environment: "{{ edge_proxy_runtime_environment }}"
  no_log: true
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ edge_proxy_compose_project_name }}"
      - --file
      - "{{ edge_proxy_compose_file }}"
      - restart
      - traefik
    chdir: "{{ edge_proxy_dir }}"
  changed_when: true
  when: edge_proxy_running.stdout | default('') | trim | length > 0
