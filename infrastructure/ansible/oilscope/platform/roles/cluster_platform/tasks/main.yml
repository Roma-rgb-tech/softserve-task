---
- name: Refuse to run without a Cloudflare token for the DNS-01 challenge
  ansible.builtin.fail:
    msg: >-
      cluster_platform_cloudflare_token is empty. cert-manager proves the
      public hostname through Cloudflare's API, so map CF_DNS_API_TOKEN in the
      secret_mappings of the first k3s server (kept in the configuration for
      a managed cluster too).
  when: cluster_platform_cloudflare_token | length == 0

- name: Refuse to run without an ACME account email
  ansible.builtin.fail:
    msg: >-
      cluster_platform_acme_email is empty. Set public_endpoint.acme_email on
      the node that carries the public hostname.
  when: cluster_platform_acme_email | length == 0

- name: Refuse to run without a Grafana administrator password
  ansible.builtin.fail:
    msg: >-
      cluster_platform_grafana_password is empty. Map GRAFANA_ADMIN_PASSWORD
      in the secret_mappings of the first k3s server and list its container
      in generated_secrets, so the deployment invents the value once.
  when: cluster_platform_grafana_password | length == 0

- name: Install Traefik on every node
  kubernetes.core.helm:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    name: traefik
    chart_repo_url: "{{ cluster_platform_charts.traefik.repo }}"
    chart_ref: "{{ cluster_platform_charts.traefik.chart }}"
    chart_version: "{{ cluster_platform_charts.traefik.version }}"
    release_namespace: "{{ cluster_platform_charts.traefik.namespace }}"
    create_namespace: true
    values_files: >-
      {{ [role_path ~ '/files/values/traefik.yaml']
         + ([role_path ~ '/files/values/traefik-managed.yaml']
            if cluster_platform_managed | bool else []) }}
    values: >-
      {{ {
           'service': {
             'annotations': cluster_platform_traefik_annotations[cluster_platform_cloud].public,
             'additionalServices': {
               'internal': {
                 'annotations': cluster_platform_traefik_annotations[cluster_platform_cloud].internal
               }
             }
           }
         } if cluster_platform_managed | bool else {} }}
    wait: true
    wait_timeout: "{{ cluster_platform_traefik_timeout }}"

- name: Install cert-manager
  kubernetes.core.helm:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    name: cert-manager
    chart_repo_url: "{{ cluster_platform_charts.cert_manager.repo }}"
    chart_ref: "{{ cluster_platform_charts.cert_manager.chart }}"
    chart_version: "{{ cluster_platform_charts.cert_manager.version }}"
    release_namespace: "{{ cluster_platform_charts.cert_manager.namespace }}"
    create_namespace: true
    values_files:
      - "{{ role_path }}/files/values/cert-manager.yaml"
    wait: true

- name: Give cert-manager the Cloudflare token
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token
        namespace: "{{ cluster_platform_charts.cert_manager.namespace }}"
      type: Opaque
      data:
        api-token: "{{ cluster_platform_cloudflare_token | b64encode }}"
  no_log: true

- name: Issue certificates from Let's Encrypt over DNS-01
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    state: present
    template: cluster-issuer.yaml.j2

- name: Install the CloudNativePG operator
  kubernetes.core.helm:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    name: cnpg
    chart_repo_url: "{{ cluster_platform_charts.cloudnative_pg.repo }}"
    chart_ref: "{{ cluster_platform_charts.cloudnative_pg.chart }}"
    chart_version: "{{ cluster_platform_charts.cloudnative_pg.version }}"
    release_namespace: "{{ cluster_platform_charts.cloudnative_pg.namespace }}"
    create_namespace: true
    values_files:
      - "{{ role_path }}/files/values/cloudnative-pg.yaml"
    wait: true

- name: Create the monitoring namespace, its allow list and the Grafana login
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    state: present
    template: monitoring-access.yaml.j2
  no_log: true

- name: Install Prometheus and Grafana
  kubernetes.core.helm:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    name: kube-prometheus-stack
    chart_repo_url: "{{ cluster_platform_charts.monitoring.repo }}"
    chart_ref: "{{ cluster_platform_charts.monitoring.chart }}"
    chart_version: "{{ cluster_platform_charts.monitoring.version }}"
    release_namespace: "{{ cluster_platform_charts.monitoring.namespace }}"
    values_files:
      - "{{ role_path }}/files/values/kube-prometheus-stack.yaml"
    values:
      prometheus:
        ingress:
          hosts:
            - "prometheus.{{ cluster_platform_internal_domain }}"
        prometheusSpec:
          storageSpec:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: "{{ cluster_platform_prometheus_storage }}"
      grafana:
        ingress:
          hosts:
            - "grafana.{{ cluster_platform_internal_domain }}"
    wait: true

- name: Scrape Traefik
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    state: present
    template: platform-monitors.yaml.j2

- name: Create the Headlamp namespace and its internal-only allow list
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    state: present
    template: headlamp-access.yaml.j2

- name: Install Headlamp, reachable only over the tailnet
  kubernetes.core.helm:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    name: headlamp
    chart_repo_url: "{{ cluster_platform_charts.headlamp.repo }}"
    chart_ref: "{{ cluster_platform_charts.headlamp.chart }}"
    chart_version: "{{ cluster_platform_charts.headlamp.version }}"
    release_namespace: "{{ cluster_platform_charts.headlamp.namespace }}"
    values_files:
      - "{{ role_path }}/files/values/headlamp.yaml"
    values:
      ingress:
        hosts:
          - host: "headlamp.{{ cluster_platform_internal_domain }}"
            paths:
              - path: /
                type: Prefix
    wait: true

- name: Tell the operator how to sign in
  ansible.builtin.debug:
    msg:
      - "Headlamp: http://headlamp.{{ cluster_platform_internal_domain }} - token:
        kubectl --kubeconfig {{ cluster_platform_kubeconfig }}
        -n {{ cluster_platform_charts.headlamp.namespace }} get secret headlamp-operator-token
        -o jsonpath='{.data.token}' | base64 -d"
      - "Grafana: http://grafana.{{ cluster_platform_internal_domain }} - admin, password in
        the GRAFANA_ADMIN_PASSWORD container of the cloud secret store"
      - "Prometheus: http://prometheus.{{ cluster_platform_internal_domain }}"
