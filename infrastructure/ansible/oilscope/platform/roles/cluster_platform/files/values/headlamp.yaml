---
# Headlamp is reached only from inside the clouds' networks - that is, over the
# tailnet. The Ingress host and the allow list are added by the role, since
# they come from the project configuration.
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-internal-only@kubernetescrd

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
