---
# One Traefik on every node, so the site answers on whichever node a visitor
# lands on - the DNS record points at one of them, but none is special.
deployment:
  kind: DaemonSet

# A surge pod would wait forever for the host ports the old one still holds,
# so a node gives up its Traefik first and gets the new one straight after.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Traefik takes ports 80 and 443 on every node itself, through hostPort,
# rather than behind ServiceLB. ServiceLB's svclb pods masquerade what they
# forward, so Traefik would see every visitor as a pod address and could not
# tell the operator (arriving from the bastion's private address over the
# tailnet) from the internet - the internal-only allow list would refuse both.
# The CNI's portmap plugin only rewrites the destination, so the source
# address survives. The Service stays for the metrics and the dashboard.
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443

service:
  spec:
    type: ClusterIP

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    # With no load balancer there is no address to publish on the Ingresses.
    publishedService:
      enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
