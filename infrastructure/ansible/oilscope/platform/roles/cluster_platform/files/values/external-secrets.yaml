---
# The controller itself holds no cloud credentials: each SecretStore names
# the service account it authenticates as (Azure workload identity), so only
# the namespace that owns that account can read its Key Vault secrets.
serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
