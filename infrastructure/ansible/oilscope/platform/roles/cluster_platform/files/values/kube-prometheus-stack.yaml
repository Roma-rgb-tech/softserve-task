---
# Prometheus, its operator, node-exporter, kube-state-metrics and Grafana.
# Alerts stay with the clouds' own monitoring for now, so Alertmanager is off.
alertmanager:
  enabled: false

# k3s runs the scheduler, the controller manager and the proxy inside the k3s
# process and keeps their metrics on localhost, so the default scrape targets
# would only ever show as down. Their rules go with them.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-internal-only@kubernetescrd
    paths:
      - /
  prometheusSpec:
    # Pick up every ServiceMonitor and PodMonitor in the cluster, not only the
    # ones this release created.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # The nodes have 4 GB each. A few days of history is enough to see what
    # happened and keeps Prometheus's memory and disk in check.
    retention: 3d
    retentionSize: 4GB
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  admin:
    existingSecret: grafana-admin
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-internal-only@kubernetescrd
  # Grafana 13 downloads a handful of "preinstalled" app plugins (traces,
  # profiles, Loki and metrics drill-down) on every start, while it migrates
  # its SQLite database. None of them has a data source here, and on a fresh
  # pod the two raced into "database is locked" and a Grafana that never
  # answered its readiness probe. Turned off, and given room to start.
  grafana.ini:
    plugins:
      preinstall_disabled: true
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
