---
# Everything here runs on the controller. Helm and the Kubernetes modules reach
# the cluster through this kubeconfig, which the k3s role or, for a managed
# cluster, the managed_kubernetes role wrote.
cluster_platform_kubeconfig: "{{ oilscope_kubeconfig }}"

# One entry per chart. The version is a Helm constraint, so patch releases come
# in on their own while a new major waits for someone to read its changelog.
cluster_platform_charts:
  traefik:
    repo: https://traefik.github.io/charts
    chart: traefik
    version: "^41.0.0"
    namespace: traefik
  cert_manager:
    repo: https://charts.jetstack.io
    chart: cert-manager
    version: "^1.18.0"
    namespace: cert-manager
  cloudnative_pg:
    repo: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: "^0.29.0"
    namespace: cnpg-system
  monitoring:
    repo: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: "^91.0.0"
    namespace: monitoring
  headlamp:
    repo: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    version: "^0.45.0"
    namespace: headlamp

# Let's Encrypt. Point it at the staging directory while experimenting: the
# production one allows five certificates for the same name a week.
cluster_platform_acme_server: https://acme-v02.api.letsencrypt.org/directory
cluster_platform_acme_email: ""
cluster_platform_cloudflare_token: ""
cluster_platform_grafana_password: ""

cluster_platform_internal_domain: "{{ oilscope_internal_domain }}"
cluster_platform_private_ranges: "{{ oilscope_private_ranges }}"

# k3s on the VMs, or a managed cluster from the cloud. On a managed one Traefik
# sits behind the cloud's load balancers instead of on the nodes' host ports.
cluster_platform_managed: "{{ oilscope_kubernetes_managed | bool }}"
cluster_platform_cloud: "{{ oilscope_kubernetes_cloud }}"

# Prometheus' volume. Persistent Disk on GKE starts at 10 GB.
cluster_platform_prometheus_storage: >-
  {{ '10Gi' if (cluster_platform_managed | bool and cluster_platform_cloud == 'gcp') else '5Gi' }}

# What makes one of Traefik's two Services face the internet and the other
# stay inside the network, per cloud. AWS gets Network Load Balancers, which
# keep the visitor's address; its default Classic one would replace it.
cluster_platform_traefik_annotations:
  gcp:
    public: {}
    internal:
      networking.gke.io/load-balancer-type: Internal
  aws:
    public:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
    internal:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  azure:
    public: {}
    internal:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
