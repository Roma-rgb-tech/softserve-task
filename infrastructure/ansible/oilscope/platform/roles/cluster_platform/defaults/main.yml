---
cluster_platform_kubeconfig: "{{ oilscope_kubeconfig }}"

cluster_platform_charts:
  traefik:
    repo: https://traefik.github.io/charts
    chart: traefik
    version: "^41.0.0"
    namespace: traefik
  cert_manager:
    repo: https://charts.jetstack.io
    chart: cert-manager
    version: "^1.18.0"
    namespace: cert-manager
  cloudnative_pg:
    repo: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: "^0.29.0"
    namespace: cnpg-system
  monitoring:
    repo: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: "^91.0.0"
    namespace: monitoring
  headlamp:
    repo: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    version: "^0.45.0"
    namespace: headlamp
  argo_cd:
    repo: https://argoproj.github.io/argo-helm
    chart: argo-cd
    version: "^10.10.0"
    namespace: argocd

cluster_platform_acme_server: https://acme-v02.api.letsencrypt.org/directory
cluster_platform_acme_email: ""
cluster_platform_cloudflare_token: ""
cluster_platform_grafana_password: ""

cluster_platform_internal_domain: "{{ oilscope_internal_domain }}"
cluster_platform_private_ranges: "{{ oilscope_private_ranges }}"

cluster_platform_managed: "{{ oilscope_kubernetes_managed | bool }}"
cluster_platform_gitops: "{{ oilscope_gitops_enabled | bool }}"
cluster_platform_cloud: "{{ oilscope_kubernetes_cloud }}"

cluster_platform_traefik_timeout: "{{ '15m' if cluster_platform_managed | bool else '5m' }}"

cluster_platform_prometheus_storage: >-
  {{ '10Gi' if (cluster_platform_managed | bool and cluster_platform_cloud == 'gcp') else '5Gi' }}

cluster_platform_traefik_annotations:
  gcp:
    public: {}
    internal:
      networking.gke.io/load-balancer-type: Internal
  aws:
    public:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-subnets: "{{ oilscope_name_prefix | trim }}-management"
    internal:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-subnets: "{{ oilscope_name_prefix | trim }}-eks-primary"
  azure:
    public: {}
    internal:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
