---
cluster_platform_kubeconfig: "{{ oilscope_kubeconfig }}"

cluster_platform_charts:
  traefik:
    repo: https://traefik.github.io/charts
    chart: traefik
    version: "^41.0.0"
    namespace: traefik
  cert_manager:
    repo: https://charts.jetstack.io
    chart: cert-manager
    version: "^1.18.0"
    namespace: cert-manager
  cloudnative_pg:
    repo: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: "^0.29.0"
    namespace: cnpg-system
  monitoring:
    repo: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: "^91.0.0"
    namespace: monitoring
  headlamp:
    repo: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    version: "^0.45.0"
    namespace: headlamp
  argo_cd:
    repo: https://argoproj.github.io/argo-helm
    chart: argo-cd
    version: "^10.10.0"
    namespace: argocd
  external_secrets:
    repo: https://charts.external-secrets.io
    chart: external-secrets
    version: "^2.11.0"
    namespace: external-secrets
  eck:
    repo: https://helm.elastic.co
    chart: eck-operator
    version: "^3.5.0"
    namespace: elastic-system

cluster_platform_acme_server: https://acme-v02.api.letsencrypt.org/directory
cluster_platform_acme_email: ""
cluster_platform_cloudflare_token: ""
cluster_platform_grafana_password: ""

# Alerting. The routing key comes from the PAGERDUTY_ROUTING_KEY mapping of
# the first k3s server; left empty, Alertmanager runs and pages nobody.
cluster_platform_pagerduty_routing_key: ""
# The "monitoring" block of the project configuration, so the cluster alerts
# use the same thresholds as the clouds' own.
cluster_platform_alert_thresholds: {}
cluster_platform_cpu_percent: "{{ cluster_platform_alert_thresholds.cpu_percent | default(80) }}"
cluster_platform_cpu_critical_percent: 95
cluster_platform_memory_percent: "{{ cluster_platform_alert_thresholds.memory_percent | default(85) }}"
cluster_platform_disk_percent: "{{ cluster_platform_alert_thresholds.disk_percent | default(85) }}"
cluster_platform_runbook_url: https://github.com/ua-academy-projects/push-and-pray/blob/main/docs/runbooks

cluster_platform_internal_domain: "{{ oilscope_internal_domain }}"
cluster_platform_private_ranges: "{{ oilscope_private_ranges }}"

cluster_platform_managed: "{{ oilscope_kubernetes_managed | bool }}"
cluster_platform_gitops: "{{ oilscope_gitops_enabled | bool }}"
cluster_platform_external_secrets: "{{ oilscope_external_secrets | bool }}"

# Logs: ECK runs Elasticsearch, Kibana, Logstash and Filebeat in their own
# namespace. One Elasticsearch node is enough for a stand; the version is the
# Elastic Stack release all four run.
cluster_platform_logging: "{{ oilscope_logging_enabled | default(false) | bool }}"
cluster_platform_logging_namespace: logging
cluster_platform_elastic_version: "9.2.4"
cluster_platform_logging_storage_gb: "{{ (oilscope_logging | default({})).storage_gb | default(10) }}"
cluster_platform_logging_retention_days: "{{ (oilscope_logging | default({})).retention_days | default(7) }}"
# The namespace whose containers Logstash parses as OilScope services.
cluster_platform_logging_app_namespace: "{{ oilscope_namespace | default('oilscope') }}"
cluster_platform_cloud: "{{ oilscope_kubernetes_cloud }}"

cluster_platform_traefik_timeout: "{{ '15m' if cluster_platform_managed | bool else '5m' }}"

cluster_platform_prometheus_storage: >-
  {{ '10Gi' if (cluster_platform_managed | bool and cluster_platform_cloud == 'gcp') else '5Gi' }}

cluster_platform_traefik_annotations:
  gcp:
    public: {}
    internal:
      networking.gke.io/load-balancer-type: Internal
  aws:
    public:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-subnets: "{{ oilscope_name_prefix | trim }}-management"
    internal:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-subnets: "{{ oilscope_name_prefix | trim }}-eks-primary"
  azure:
    public: {}
    internal:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
# The Job that puts the index template runs curl from this image.
cluster_platform_logging_curl_image: curlimages/curl:8.15.0
# The logs-oilscope-* data streams: a lifecycle that deletes old lines, a
# single shard with no replica, and keyword fields for filtering in Kibana.
# Priority above the built-in logs-*-* template (100) so this one wins.
cluster_platform_logging_index_template:
  index_patterns: ["logs-oilscope-*"]
  data_stream: {}
  priority: 300
  template:
    settings:
      number_of_shards: 1
      number_of_replicas: 0
    lifecycle:
      data_retention: "{{ cluster_platform_logging_retention_days | int }}d"
    mappings:
      properties:
        "@timestamp":
          type: date
        message:
          type: text
        log:
          properties:
            level:
              type: keyword
            logger:
              type: keyword
        service:
          properties:
            name:
              type: keyword
        url:
          properties:
            path:
              type: keyword
        http:
          properties:
            request:
              properties:
                method:
                  type: keyword
            response:
              properties:
                status_code:
                  type: integer
cluster_platform_logging_template_job: >-
  logs-index-template-{{ (cluster_platform_logging_index_template | to_json | hash('sha1'))[:8] }}
