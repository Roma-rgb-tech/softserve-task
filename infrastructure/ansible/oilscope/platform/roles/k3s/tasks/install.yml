---
- name: Load the kernel modules the container network needs
  become: true
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Let bridged traffic through iptables and forward packets
  become: true
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables

- name: Download the k3s binary and check it against the published checksum
  become: true
  ansible.builtin.get_url:
    url: >-
      {{ k3s_release_url }}/{{ k3s_version | urlencode }}/k3s{{ '' if k3s_arch == 'amd64' else '-' ~ k3s_arch }}
    checksum: >-
      sha256:{{ k3s_release_url }}/{{ k3s_version | urlencode }}/sha256sum-{{ k3s_arch }}.txt
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

- name: Link the tools k3s bundles
  become: true
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop:
    - kubectl
    - crictl
    - ctr

- name: Create the configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the systemd unit
  become: true
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "/etc/systemd/system/{{ k3s_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s
