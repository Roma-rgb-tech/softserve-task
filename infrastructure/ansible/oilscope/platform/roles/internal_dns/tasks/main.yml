---
- name: Install dig, which the role checks the answers with
  become: true
  ansible.builtin.apt:
    name: bind9-dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Run the chosen DNS server
  ansible.builtin.include_tasks: "{{ internal_dns_server }}.yml"

- name: Apply a pending restart before checking the answers
  ansible.builtin.meta: flush_handlers

- name: Check that the bastion answers for the operator pages
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@{{ internal_dns_listen }}"
      - "{{ internal_dns_names | first }}.{{ internal_dns_domain }}"
  register: internal_dns_answer
  changed_when: false
  until: internal_dns_answer.stdout_lines | length > 0
  retries: 10
  delay: 3
  failed_when: internal_dns_answer.stdout_lines | length == 0

- name: Point the tailnet's split DNS at the bastions
  ansible.builtin.include_tasks: split_dns.yml
  run_once: true
