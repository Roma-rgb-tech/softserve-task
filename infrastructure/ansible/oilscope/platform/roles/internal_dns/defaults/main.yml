---
internal_dns_server: technitium

internal_dns_technitium_image: docker.io/technitium/dns-server:15.6.0
internal_dns_technitium_dir: /var/lib/technitium
internal_dns_technitium_port: 5380
internal_dns_technitium_api: "http://{{ internal_dns_listen }}:{{ internal_dns_technitium_port }}/api"
internal_dns_technitium_name: dns

internal_dns_version: v1.14.6
internal_dns_release_url: https://github.com/coredns/coredns/releases/download

internal_dns_domain: "{{ oilscope_internal_domain }}"

internal_dns_names: >-
  {{ ['headlamp', 'homepage', 'grafana', 'prometheus']
     + (['argocd'] if oilscope_gitops_enabled | default(false) | bool else []) }}
internal_dns_addresses: >-
  {{ (groups['k3s_server'] | default([]) + groups['k3s_agent'] | default([]))
     | map('extract', hostvars, 'internal_ip') | select | list }}

internal_dns_listen: "{{ internal_ip }}"
internal_dns_ttl: 60

internal_dns_install_dir: "/opt/coredns/{{ internal_dns_version }}"
internal_dns_config_dir: /etc/coredns

internal_dns_tailnet: "{{ (oilscope_project_config.tailscale | default({})).tailnet | default('-') }}"
internal_dns_nameservers: >-
  {{ groups['bastion'] | map('extract', hostvars, 'internal_ip') | select | list }}
internal_dns_tailnet_api: https://api.tailscale.com/api/v2
internal_dns_tailnet_api_key_variable: TAILSCALE_API_KEY
