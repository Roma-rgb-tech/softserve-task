---
- name: Select the containers held in AWS
  ansible.builtin.set_fact:
    secret_versions_targets: >-
      {{ secret_versions_catalog | selectattr('clouds', 'contains', 'aws') | list }}
    secret_versions_present: []

- name: Resolve the target region
  ansible.builtin.set_fact:
    secret_versions_aws_region: >-
      {{ secret_versions_region
         | default(lookup('ansible.builtin.env', 'AWS_REGION'), true)
         | default(lookup('ansible.builtin.env', 'AWS_DEFAULT_REGION'), true)
         | default(secret_versions_config.aws.regions | default([]) | first | default(''), true) }}

- name: Refuse to upload without a target region
  ansible.builtin.fail:
    msg: >-
      No AWS region resolved. Set secret_versions_region, $AWS_REGION or
      aws.regions in the project configuration.
  when: secret_versions_aws_region | length == 0

- name: Look for the containers
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_aws }}"
      - secretsmanager
      - describe-secret
      - --secret-id
      - "{{ item.secret_id }}"
      - --region
      - "{{ secret_versions_aws_region }}"
      - --query
      - ARN
      - --output
      - text
  loop: "{{ secret_versions_targets }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_describe
  changed_when: false
  failed_when: false
  check_mode: false

# Every container nobody supplied a value for is asked what it already holds.
# A container that is already filled is left alone whether the value was
# generated or uploaded: re-running the deployment is not a reason to rotate a
# credential the running services are using.
- name: Look for values the containers already hold
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_aws }}"
      - secretsmanager
      - list-secret-version-ids
      - --secret-id
      - "{{ item.secret_id }}"
      - --region
      - "{{ secret_versions_aws_region }}"
      - --query
      - Versions[].VersionId
      - --output
      - text
  loop: >-
    {{ secret_versions_targets
       | rejectattr('secret_id', 'in', secret_versions_supplied | default([]))
       | list }}
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_existing
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note the containers that are already filled
  ansible.builtin.set_fact:
    secret_versions_present: >-
      {{ secret_versions_present
         + ([item.item.secret_id]
            if item.rc == 0
               and (item.stdout | default('') | trim) not in ['', 'None']
            else []) }}
  loop: "{{ secret_versions_existing.results | default([]) }}"
  loop_control:
    label: "{{ item.item.secret_id }}"

# Nothing has been written yet, and this is the last moment that is still true.
# A container with no value in the environment, nothing stored, and no place on
# the generated list has no value available from anywhere - and a run that
# discovers that halfway through leaves some workloads rotated and some not.
- name: Refuse to upload incomplete secret versions
  ansible.builtin.fail:
    msg: >-
      No value available for
      {{ secret_versions_unavailable | map(attribute='variable') | join(', ') }}:
      the environment holds none, the container is empty, and it is not listed
      in generated_secrets.
  vars:
    secret_versions_unavailable: >-
      {{ secret_versions_targets
         | rejectattr('secret_id', 'in', secret_versions_supplied | default([]))
         | rejectattr('secret_id', 'in', secret_versions_present)
         | rejectattr('generated')
         | list }}
  when: secret_versions_unavailable | length > 0

- name: Choose the containers that get a new version
  ansible.builtin.set_fact:
    secret_versions_writes: >-
      {{ secret_versions_targets
         | rejectattr('secret_id', 'in', secret_versions_present) | list }}

- name: Report the containers that are left alone
  ansible.builtin.debug:
    msg: "{{ item }} already holds a value in aws, leaving it alone"
  loop: "{{ secret_versions_present }}"

# file:///dev/stdin makes the AWS CLI read the payload from stdin, so the value
# never becomes a command argument and cannot appear in ps output or a shell
# history. no_log keeps it out of the Ansible output and any callback log, and
# stdin_add_newline is off because a trailing newline would become part of the
# stored value.
- name: Add a new version to every container
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_aws }}"
      - secretsmanager
      - put-secret-value
      - --secret-id
      - "{{ item.secret_id }}"
      - --region
      - "{{ secret_versions_aws_region }}"
      - --secret-string
      - file:///dev/stdin
      - --query
      - VersionId
      - --output
      - text
    stdin: >-
      {{ lookup('ansible.builtin.env', item.variable)
         | default(secret_versions_invented[item.secret_id] | default(''), true) }}
    stdin_add_newline: false
  loop: "{{ secret_versions_writes }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_added
  changed_when: true
  no_log: true
  # Not check_mode - a skipped-in-check-mode result carries the module
  # arguments, and at -vvv Ansible prints those uncensored even under no_log.
  when: not ansible_check_mode

- name: Report the new versions
  ansible.builtin.debug:
    msg: >-
      {{ item.item.secret_id }} <- {{ 'a generated value'
      if item.item.secret_id in (secret_versions_invented | default({}) | list)
      else '$' ~ item.item.variable }}
      (aws version {{ item.stdout | trim }})
  loop: "{{ secret_versions_added.results | default([]) }}"
  loop_control:
    label: "{{ item.item.secret_id }}"
  when: not ansible_check_mode
