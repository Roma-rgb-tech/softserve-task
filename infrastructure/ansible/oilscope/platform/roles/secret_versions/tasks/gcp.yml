---
- name: Select the containers held in GCP
  ansible.builtin.set_fact:
    secret_versions_targets: >-
      {{ secret_versions_catalog | selectattr('clouds', 'contains', 'gcp') | list }}
    secret_versions_present: []
    secret_versions_unchanged: []

- name: Resolve the target project
  ansible.builtin.set_fact:
    secret_versions_project: >-
      {{ secret_versions_project_id
         | default(lookup('ansible.builtin.env', 'GOOGLE_PROJECT'), true)
         | default(secret_versions_config.gcp.project_id | default(''), true) }}

- name: Refuse to upload without a target project
  ansible.builtin.fail:
    msg: >-
      No GCP project resolved. Set secret_versions_project_id, $GOOGLE_PROJECT
      or gcp.project_id in the project configuration.
  when: secret_versions_project | length == 0

- name: Look for the containers
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - describe
      - "{{ item.secret_id }}"
      - "--project={{ secret_versions_project }}"
      - "--format=value(name)"
  loop: "{{ secret_versions_targets }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_describe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Look for values the containers already hold
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - versions
      - list
      - "{{ item.secret_id }}"
      - "--project={{ secret_versions_project }}"
      - --filter=state:ENABLED
      - --limit=1
      - "--format=value(name)"
  loop: >-
    {{ secret_versions_targets
       | rejectattr('secret_id', 'in', secret_versions_supplied | default([]))
       | list }}
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_existing
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note the containers that are already filled
  ansible.builtin.set_fact:
    secret_versions_present: >-
      {{ secret_versions_present
         + ([item.item.secret_id]
            if item.rc == 0 and (item.stdout | default('') | trim) | length > 0
            else []) }}
  loop: "{{ secret_versions_existing.results | default([]) }}"
  loop_control:
    label: "{{ item.item.secret_id }}"

- name: Refuse to upload incomplete secret versions
  ansible.builtin.fail:
    msg: >-
      No value available for
      {{ secret_versions_unavailable | map(attribute='variable') | join(', ') }}:
      the environment holds none, the container is empty, and it is not listed
      in generated_secrets.
  vars:
    secret_versions_unavailable: >-
      {{ secret_versions_targets
         | rejectattr('secret_id', 'in', secret_versions_supplied | default([]))
         | rejectattr('secret_id', 'in', secret_versions_present)
         | rejectattr('generated')
         | list }}
  when: secret_versions_unavailable | length > 0

- name: Read the value each supplied container serves
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - versions
      - access
      - latest
      - "--secret={{ item.secret_id }}"
      - "--project={{ secret_versions_project }}"
  loop: >-
    {{ secret_versions_targets
       | selectattr('secret_id', 'in', secret_versions_supplied | default([]))
       | list }}
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_current
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Note the containers that already serve the supplied value
  ansible.builtin.set_fact:
    secret_versions_unchanged: >-
      {{ secret_versions_unchanged | default([])
         + ([item.item.secret_id]
            if item.rc == 0
               and (item.stdout | default('') | trim)
                   == (lookup('ansible.builtin.env', item.item.variable) | trim)
            else []) }}
  loop: "{{ secret_versions_current.results | default([]) }}"
  no_log: true

- name: Choose the containers that get a new version
  ansible.builtin.set_fact:
    secret_versions_writes: >-
      {{ secret_versions_targets
         | rejectattr('secret_id', 'in', secret_versions_present)
         | rejectattr('secret_id', 'in', secret_versions_unchanged | default([]))
         | list }}

- name: Report the containers that are left alone
  ansible.builtin.debug:
    msg: "{{ item }} already holds a value in gcp, leaving it alone"
  loop: "{{ secret_versions_present + (secret_versions_unchanged | default([])) }}"

- name: Add a new version to every container
  ansible.builtin.command:
    argv:
      - "{{ secret_versions_gcloud }}"
      - secrets
      - versions
      - add
      - "{{ item.secret_id }}"
      - "--project={{ secret_versions_project }}"
      - "--data-file=-"
      - "--format=value(name)"
    stdin: >-
      {{ lookup('ansible.builtin.env', item.variable)
         | default(secret_versions_invented[item.secret_id] | default(''), true) }}
    stdin_add_newline: false
  loop: "{{ secret_versions_writes }}"
  loop_control:
    label: "{{ item.secret_id }}"
  register: secret_versions_added
  changed_when: true
  no_log: true
  when: not ansible_check_mode

- name: Report the new versions
  ansible.builtin.debug:
    msg: >-
      {{ item.item.secret_id }} <- {{ 'a generated value'
      if item.item.secret_id in (secret_versions_invented | default({}) | list)
      else '$' ~ item.item.variable }}
      (gcp version {{ item.stdout | trim | regex_replace('^.*/', '') }})
  loop: "{{ secret_versions_added.results | default([]) }}"
  loop_control:
    label: "{{ item.item.secret_id }}"
  when: not ansible_check_mode
