---
- name: Refuse to run without the project configuration
  ansible.builtin.fail:
    msg: >-
      secret_versions_config_file is empty. Pass the project configuration -
      the same file Terraform reads - so the containers to fill are known.
  when: secret_versions_config_file | length == 0

- name: Read the project configuration
  ansible.builtin.set_fact:
    secret_versions_config: >-
      {{ lookup('ansible.builtin.file', secret_versions_config_file) | from_json }}

# The unit of upload is the container. One container is usually read by several
# workloads, so the mappings are collapsed to (container, workload) pairs first.
- name: Collect the container and workload pairs
  ansible.builtin.set_fact:
    secret_versions_pairs: >-
      {{ secret_versions_pairs | default([])
         + (secret_versions_vm.value.secret_mappings | default({}) | dict2items
            | map(attribute='value') | unique | list
            | zip_longest([], fillvalue=secret_versions_vm.key) | list) }}
  loop: "{{ secret_versions_config.vms | dict2items }}"
  loop_control:
    loop_var: secret_versions_vm
    label: "{{ secret_versions_vm.key }}"

- name: Resolve the cloud every VM runs in
  ansible.builtin.set_fact:
    secret_versions_vm_clouds: >-
      {{ secret_versions_vm_clouds | default({}) | combine({
           secret_versions_vm.key: secret_versions_vm.value.cloud
                                   | default(secret_versions_config.default_cloud)
         }) }}
  loop: "{{ secret_versions_config.vms | dict2items }}"
  loop_control:
    loop_var: secret_versions_vm
    label: "{{ secret_versions_vm.key }}"

# The variable name comes from the container ID, not from the key side of
# secret_mappings: that key is scoped to one VM, so DB_PASSWORD means a
# different secret on every workload and one shell cannot hold them all.
- name: Derive a variable name for every container
  ansible.builtin.set_fact:
    secret_versions_ids: >-
      {{ secret_versions_pairs | map(attribute='0') | unique | sort | list }}
    secret_versions_prefix: >-
      {{ secret_versions_config.name_prefix }}-{{ secret_versions_config.environment }}-
    secret_versions_generated_ids: >-
      {{ (secret_versions_config.generated_secrets | default([]))
         + secret_versions_generate }}

- name: Prepare the short and the fully qualified variable names
  ansible.builtin.set_fact:
    secret_versions_short_names: >-
      {{ secret_versions_ids
         | map('regex_replace', '^' ~ (secret_versions_prefix | regex_escape), '')
         | map('upper') | map('regex_replace', '[^A-Z0-9]', '_') | list }}
    secret_versions_full_names: >-
      {{ secret_versions_ids
         | map('upper') | map('regex_replace', '[^A-Z0-9]', '_') | list }}

# Dropping the project prefix only stays safe while it keeps every name
# distinct. If two containers would collapse onto one variable, all of them
# keep the full name: a shorter prompt is not worth writing a value into the
# wrong container.
- name: Choose the variable names
  ansible.builtin.set_fact:
    secret_versions_variables: >-
      {{ secret_versions_short_names
         if (secret_versions_short_names | unique | length)
            == (secret_versions_short_names | length)
         else secret_versions_full_names }}

- name: Build the upload catalog
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog | default([]) + [{
           'secret_id': secret_versions_entry.0,
           'variable': secret_versions_entry.1,
           'generated': secret_versions_entry.0 in secret_versions_generated_ids
                        or secret_versions_entry.1 in secret_versions_generated_ids,
           'read_by': secret_versions_pairs
                      | selectattr('0', 'eq', secret_versions_entry.0)
                      | map(attribute='1') | sort | list,
           'clouds': secret_versions_pairs
                     | selectattr('0', 'eq', secret_versions_entry.0)
                     | map(attribute='1')
                     | map('extract', secret_versions_vm_clouds)
                     | unique | sort | list
         }] }}
  loop: "{{ secret_versions_ids | zip(secret_versions_variables) | list }}"
  loop_control:
    loop_var: secret_versions_entry
    label: "{{ secret_versions_entry.0 }}"

- name: Keep only the requested containers
  ansible.builtin.set_fact:
    secret_versions_catalog: >-
      {{ secret_versions_catalog
         | selectattr('secret_id', 'in', secret_versions_only)
         | list
         + (secret_versions_catalog
            | rejectattr('secret_id', 'in', secret_versions_only)
            | selectattr('variable', 'in', secret_versions_only)
            | list) }}
  when: secret_versions_only | length > 0

- name: Show which variable feeds which container
  ansible.builtin.debug:
    msg: >-
      {{ item.variable }} -> {{ item.secret_id }}
      in {{ item.clouds | join(', ') }}
      (read by {{ item.read_by | join(', ') }}){{ ', generated when unset'
      if item.generated else '' }}
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.secret_id }}"

# A value in the environment is an instruction to write it, whatever the
# container currently holds - that is what a rotation is. Everything else is
# decided against the cloud, once the containers have been asked what they
# already have, so a routine run needs nothing exported at all.
- name: Note which containers the environment supplies a value for
  ansible.builtin.set_fact:
    secret_versions_supplied: >-
      {{ secret_versions_supplied | default([])
         + ([item.secret_id]
            if lookup('ansible.builtin.env', item.variable) | length > 0
            else []) }}
  loop: "{{ secret_versions_catalog }}"
  loop_control:
    label: "{{ item.variable }}"

# The value is made here rather than in Terraform on purpose: random_password
# writes its result into the state file, and the state is not a place for a
# payload. Made here it exists only in the memory of this play, and leaves it
# on stdin of the provider CLI.
#
# The alphabet is deliberately alphanumeric. A punctuation character is fine
# for a secret and not fine for a value that is concatenated into a URL by
# something downstream - a slash in a password once turned a database DSN into
# a different host.
- name: Invent a value for every generated container left unset
  ansible.builtin.set_fact:
    secret_versions_invented: >-
      {{ secret_versions_invented | default({}) | combine({
           item.secret_id: lookup('ansible.builtin.password',
                                  '/dev/null length=40 chars=ascii_letters,digits')
         }) }}
  loop: "{{ secret_versions_catalog | selectattr('generated') | list }}"
  loop_control:
    label: "{{ item.secret_id }}"
  when: lookup('ansible.builtin.env', item.variable) | length == 0
  no_log: true

- name: Add the versions in every cloud that holds a container
  ansible.builtin.include_tasks: "{{ secret_versions_cloud }}.yml"
  loop: >-
    {{ secret_versions_catalog | map(attribute='clouds')
       | flatten | unique | sort | list }}
  loop_control:
    loop_var: secret_versions_cloud
