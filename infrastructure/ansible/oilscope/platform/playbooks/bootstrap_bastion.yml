---
- name: Configure the bastion
  hosts: bastion
  become: true
  gather_facts: false
  pre_tasks:
    - name: Look for sshd on the configured port
      become: false
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        port: "{{ bastion_ssh_port }}"
        state: started
        connect_timeout: 5
        timeout: 5
      register: bastion_configured_port
      ignore_errors: true
      delegate_to: localhost

    - name: Connect on the image default port until the bastion is moved
      ansible.builtin.set_fact:
        ansible_port: 22
      when:
        - bastion_connect_override | length == 0
        - bastion_configured_port is failed

  roles:
    - role: oilscope.platform.bastion
  post_tasks:
    - name: Wait for the final bastion SSH port from the controller
      become: false
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        port: "{{ bastion_ssh_port }}"
        state: started
        connect_timeout: 5
        timeout: 60
      delegate_to: localhost

    - name: Use the final bastion SSH port
      ansible.builtin.set_fact:
        ansible_port: "{{ bastion_ssh_port }}"

    - name: Reset the bootstrap SSH connection
      ansible.builtin.meta: reset_connection

    - name: Check the SSH connection on the final port
      ansible.builtin.ping:
      changed_when: false

- name: Join the bastions to the tailnet
  hosts: bastion
  gather_facts: false
  vars:
    oilscope_tailnet: >-
      {{ (lookup('ansible.builtin.file', project_config_path) | from_json).tailscale is defined }}
  roles:
    - role: oilscope.platform.tailnet
      when: oilscope_tailnet | bool

- name: Answer for the operator pages' names
  hosts: bastion
  gather_facts: false
  vars:
    oilscope_tailnet: >-
      {{ (lookup('ansible.builtin.file', project_config_path) | from_json).tailscale is defined }}
  roles:
    - role: oilscope.platform.internal_dns
      when:
        - oilscope_tailnet | bool
        - groups['k3s_server'] | default([]) | length > 0
