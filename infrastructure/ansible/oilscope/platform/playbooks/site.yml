---
# Everything Ansible does after terraform apply, in the order it has to happen:
# the containers Terraform created are filled, the bastion is moved onto its
# final SSH port and joins the tailnet, and only then is the k3s cluster built
# through it and the application deployed into it.
#
# One variable drives all of it. project_config_path is the same file the
# Terraform configuration reads, so nothing is described twice.
#
# The Docker Compose deployment this replaces is kept at the
# snapshot/vm-compose tag.
- name: Add the deployment secret versions
  hosts: localhost
  gather_facts: false
  roles:
    - role: oilscope.platform.secret_versions
      vars:
        secret_versions_config_file: "{{ project_config_path }}"

- name: Reconcile the managed database credentials
  hosts: localhost
  gather_facts: false
  vars:
    oilscope_managed: >-
      {{ ((lookup('ansible.builtin.file', project_config_path) | from_json).database
          | default({})).managed | default(false) | bool }}
  roles:
    - role: oilscope.platform.managed_database
      when: oilscope_managed
      vars:
        managed_database_config_file: "{{ project_config_path }}"

- name: Configure the bastion
  ansible.builtin.import_playbook: bootstrap_bastion.yml

- name: Build the cluster and deploy the application
  ansible.builtin.import_playbook: cluster.yml
