---
- name: Add the deployment secret versions
  hosts: localhost
  gather_facts: false
  roles:
    - role: oilscope.platform.secret_versions
      vars:
        secret_versions_config_file: "{{ project_config_path }}"

- name: Reconcile the managed database credentials
  hosts: localhost
  gather_facts: false
  vars:
    oilscope_managed: >-
      {{ ((lookup('ansible.builtin.file', project_config_path) | from_json).database
          | default({})).managed | default(false) | bool }}
  roles:
    - role: oilscope.platform.managed_database
      when: oilscope_managed
      vars:
        managed_database_config_file: "{{ project_config_path }}"

- name: Configure the bastion
  ansible.builtin.import_playbook: bootstrap_bastion.yml

- name: Build the cluster and deploy the application
  ansible.builtin.import_playbook: cluster.yml
