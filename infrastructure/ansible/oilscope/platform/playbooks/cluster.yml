---
- name: Check the stand before touching it
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Refuse to run against a stand the inventory did not describe
      ansible.builtin.assert:
        that:
          - oilscope_inventory_config | length == 0
            or (oilscope_inventory_config | realpath) == (project_config_path | realpath)
        fail_msg: >-
          The inventory was built from {{ oilscope_inventory_config }} but the
          playbook was given {{ project_config_path }}. The inventory plugin
          reads $OILSCOPE_PROJECT_CONFIG and -e feeds only the playbook, so
          these two select different stands. Export the matching
          OILSCOPE_PROJECT_CONFIG before running.
        quiet: true
      vars:
        oilscope_inventory_config: >-
          {{ lookup('ansible.builtin.env', 'OILSCOPE_PROJECT_CONFIG') }}

    - name: Say which cluster this run builds on
      ansible.builtin.debug:
        msg: >-
          {{ ('Managed Kubernetes on ' ~ oilscope_kubernetes_cloud)
             if oilscope_kubernetes_managed | bool
             else 'k3s on the k3s_server and k3s_agent VMs' }}

- name: Start the first k3s server
  hosts: k3s_server[0]
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.k3s
      when: not oilscope_kubernetes_managed | bool

- name: Join the other servers one at a time
  hosts: k3s_server[1:]
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.k3s
      when: not oilscope_kubernetes_managed | bool

- name: Join the agents
  hosts: k3s_agent
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: oilscope.platform.k3s
      when: not oilscope_kubernetes_managed | bool

- name: Fetch the managed cluster's credentials
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: oilscope.platform.managed_kubernetes
      when: oilscope_kubernetes_managed | bool

- name: Make the stand's cluster the operator's current context
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: oilscope.platform.kube_context

- name: Read the values the cluster needs from the cloud secret store
  hosts: k3s_server[0]
  become: true
  gather_facts: false
  roles:
    - role: oilscope.platform.resolve_secrets
      when: not oilscope_kubernetes_managed | bool
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"

- name: Read the values the managed cluster needs, from the controller
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: oilscope.platform.resolve_secrets
      when: oilscope_kubernetes_managed | bool
      vars:
        resolve_secrets_config_path: "{{ project_config_path }}"
        resolve_secrets_from_controller: true
        resolve_secrets_vm: "{{ oilscope_secrets_vm }}"

- name: Install the platform layer and the application
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    oilscope_secrets: "{{ hostvars[oilscope_secrets_host].resolve_secrets_result | default({}) }}"
  roles:
    - role: oilscope.platform.cluster_platform
      vars:
        cluster_platform_cloudflare_token: "{{ oilscope_secrets.CF_DNS_API_TOKEN | default('') }}"
        cluster_platform_acme_email: "{{ oilscope_public_endpoint.acme_email | default('') }}"
        cluster_platform_grafana_password: "{{ oilscope_secrets.GRAFANA_ADMIN_PASSWORD | default('') }}"

    - role: oilscope.platform.cluster_app
      vars:
        cluster_app_secrets: "{{ oilscope_secrets }}"

- name: Point the names at the managed cluster's load balancers
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Point the public and internal names at the load balancers
      ansible.builtin.include_role:
        name: oilscope.platform.managed_kubernetes
        tasks_from: ingress
      vars:
        managed_kubernetes_cloudflare_token: >-
          {{ (hostvars[oilscope_secrets_host].resolve_secrets_result | default({})).CF_DNS_API_TOKEN | default('') }}
      when: oilscope_kubernetes_managed | bool

- name: Answer for the operator pages' names with the internal load balancer
  hosts: bastion
  gather_facts: false
  vars:
    oilscope_tailnet: >-
      {{ (lookup('ansible.builtin.file', project_config_path) | from_json).tailscale is defined }}
    oilscope_internal_lb: "{{ hostvars['localhost'].managed_kubernetes_internal_address | default('') }}"
  tasks:
    - name: Resolve the internal load balancer's name
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ oilscope_internal_lb }}"
      register: oilscope_internal_lb_lookup
      changed_when: false
      until: oilscope_internal_lb_lookup.rc == 0
      retries: 30
      delay: 10
      when:
        - oilscope_kubernetes_managed | bool
        - oilscope_tailnet | bool
        - oilscope_internal_lb | length > 0
        - oilscope_internal_lb is not match('^[0-9.]+$')

    - name: Point the operator pages at the internal load balancer
      ansible.builtin.include_role:
        name: oilscope.platform.internal_dns
      vars:
        internal_dns_addresses: >-
          {{ [oilscope_internal_lb]
             if oilscope_internal_lb is match('^[0-9.]+$')
             else (oilscope_internal_lb_lookup.stdout_lines
                   | map('split') | map('first') | unique | list) }}
      when:
        - oilscope_kubernetes_managed | bool
        - oilscope_tailnet | bool
        - oilscope_internal_lb | length > 0
