---
bastion_config_key: >-
  {{ inventory_hostname | regex_replace('^' ~ (oilscope_name_prefix | trim ~ '-') | regex_escape, '') }}

bastion_ssh_port: >-
  {{ (lookup('ansible.builtin.file', project_config_path) | from_json)
     .vms[bastion_config_key].ssh_port | int }}

bastion_connect_override: >-
  {{ lookup('ansible.builtin.env', 'OILSCOPE_BASTION_CONNECT_PORT') }}

ansible_port: "{{ bastion_connect_override | default(bastion_ssh_port, true) | int }}"
