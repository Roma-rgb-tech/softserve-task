---
oilscope_bastion_host: >-
  {{ groups['bastion'] | map('extract', hostvars)
     | selectattr('oilscope_cloud', 'eq', oilscope_cloud)
     | map(attribute='inventory_hostname') | first }}
oilscope_bastion_address: "{{ hostvars[oilscope_bastion_host].ansible_host }}"
oilscope_bastion_ssh_port: "{{ hostvars[oilscope_bastion_host].bastion_ssh_port }}"

ansible_ssh_common_args: >-
  {{ oilscope_ssh_base_args }}
  -o ProxyCommand="ssh -W %h:%p -q
  -p {{ oilscope_bastion_ssh_port }}
  -i {{ ansible_ssh_private_key_file }}
  {{ oilscope_ssh_base_args }}
  {{ ansible_user }}@{{ oilscope_bastion_address }}"
